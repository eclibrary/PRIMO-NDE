<!--
  Custom FOOTER — default / English. Rendered by NDE at the bottom of EVERY page, in all
  views: this file lives in the SHARED assets (src/assets/header-footer/).
  Language variants: footer.html (default/English), footer_fr.html,
  footer_de.html — keep them in sync. Only the title is translated; the link
  texts are names of sites/catalogues and stay as they are.

  CONTENT: "Our sites and catalogues" — a heading and a list of links to the
  EC Library's other sites. Markup follows the structure of the ECL site footer
  ("related" section), but with our own ec-footer__* classes: ECL's stylesheet
  is not loaded in NDE, so its classes would do nothing here.

  STYLING: src/app/shared/styles/_ec-footer.scss (loaded by _shared-theme.scss).
  No <script> here (NDE strips it).

  LINK TARGETS: copied from the current EC Library site; the Find-eR, Country
  Knowledge and EU Publications links still point to the Primo VE views
  (VU1, CKNWL, OP_PUBS). Switch them to the NDE views when those go live.
-->
<footer class="ec-footer" lang="en">
  <nav class="ec-footer__section" aria-labelledby="ec-footer-related-title">

    <ul class="ec-footer__list">
      <li class="ec-footer__item">
        <a class="ec-footer__link" href="https://ec-europa-finder.primo.exlibrisgroup.com/discovery/search?vid=32EUC_INST:VU1">Find-eR</a>
      </li>
      <li class="ec-footer__item">
        <a class="ec-footer__link" href="https://eu-lib-cat.primo.exlibrisgroup.com/discovery/search?vid=32EU_DN:EUROPEAN_UNION">EULibCat</a>
      </li>
      <li class="ec-footer__item">
        <a class="ec-footer__link" href="https://ec-europa-eu.libguides.com/">EC Library Guides</a>
      </li>
      <li class="ec-footer__item">
        <a class="ec-footer__link" href="https://eceuropaeu.sharepoint.com/sites/ec-library">EC Library on My Intracomm<span class="material-symbols-outlined ec-network-lock" data-ec-network="external" aria-hidden="true" title="Only available on the EC network">lock</span><span class="material-symbols-outlined ec-network-lock" data-ec-network="ec" aria-hidden="true" title="You are on the EC network">lock_open</span></a>
