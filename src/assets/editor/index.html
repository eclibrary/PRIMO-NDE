  } else {
    // Free-form structures (maps, nested lists): JSON — advanced users only.
    control.append(el('textarea', { class: 'json', id,
      oninput: (e) => { try { set(JSON.parse(e.target.value)); } catch { set(value, t('Not valid JSON — check commas, quotes and brackets.')); } } },
      JSON.stringify(value, null, 2)));
  }
  control.append(errBox);
  wrap.append(name, control);
  wrap.classList.toggle('changed', !same(value, getPath(original, path)));
  return wrap;
}

/* --------------------------------------------------------------- status */
function changedCount() {
  let n = 0;
  (function walk(a, b) {
    if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
      for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) walk(a[k], b[k]);
    } else if (!same(a, b)) n++;
  })(values, original);
  return n;
}
function refreshStatus() {
  const n = changedCount() + (same(languages, originalLanguages) ? 0 : 1) + librariesChanged();
  if (KIT || hasPackage()) $('#download').textContent = t('Make package'); // maker, or package editor with a zip loaded
  else $('#download').textContent = n ? `Download settings.js (${n} change${n === 1 ? '' : 's'})` : 'Download settings.js';
  document.querySelectorAll('details.section').forEach((d) => {
    if (!d._changed) return; // the Languages panel has no per-section counter
    const c = d.dataset.key === '__libraries' ? librariesChanged() : sameSection(d.dataset.key);
    d._changed.hidden = c === 0;
    d._changed.textContent = t('{n} changed', { n: c });
  });
  if (errors.size && (KIT || hasPackage())) {
    setStatus(errors.size === 1 ? t('1 field needs attention before making the package.')
      : t('{n} fields need attention before making the package.', { n: errors.size }), true);
  } else if (errors.size) setStatus(`${errors.size} field${errors.size === 1 ? ' needs' : 's need'} attention before downloading.`, true);
  else if (KIT) setStatus(maker.done && !n ? t('{file} downloaded — upload it in Alma.', { file: maker.done }) : t('Check the settings, then click "Make package".'));
  else if (hasPackage()) setStatus(pkg.done && !n ? `${pkg.done} downloaded — upload it in Alma.`
    : n ? 'Not in a package yet — click "Make package".' : 'No changes yet.');
  else setStatus(n ? 'Not downloaded yet.' : 'No changes yet.');
}
function sameSection(key) {
  let n = 0;
  (function walk(a, b) {
    if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
      for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) walk(a[k], b[k]);
    } else if (!same(a, b)) n++;
  })(values[key], original[key]);
  return n;
}
function setStatus(text, isError) { const s = $('#status'); s.textContent = text; s.className = 'status' + (isError ? ' err' : ''); }
function applyAdvanced() { document.body.classList.toggle('advanced-hidden', !$('#advanced').checked); }
function isUrl(v) { try { const u = new URL(v); return u.protocol === 'https:' || u.protocol === 'http:'; } catch { return false; } }
// Dates follow the interface language of the page (else the browser's own setting).
function formatDate(iso) { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString(UI && UI.lang ? UI.lang : undefined) : t('unknown date'); }

/* -------------------------------------------------------------- download */
/**
 * settings.js text — the same layout as scripts/config-generate.cjs
 * (writeSettingsJs), so all writers produce the same file. `how` = the
 * "to change them" sentence for the header comment.
 */
function settingsJsText(out, how) {
  return `/*\n  Settings of the ${out.label || out.view} view (${out.vid}).\n` +
    `  Read by the custom module every time a page opens; values here override the\n` +
    `  ones built into the package. ${how}\n` +
    `  Do not edit by hand unless you know JSON.\n` +
    `  Saved by: ${out.savedBy}, ${out.savedAt}\n*/\n` +
    `window.EC_SETTINGS = ${JSON.stringify(out, null, 2)};\n`;
}

/** The settings.js content (envelope) for the current form; `savedBy` says which route wrote it. */
function settingsOut(savedBy) {
  const out = { ...envelope, format: envelope.format || 1, savedAt: new Date().toISOString(), savedBy, languages, values };
  if (libraries) out.libraries = libraries; // else keep whatever the file had (none)
  return out;
}

function download() {
  if (KIT) return makePackage(); // maker mode: the button makes the whole package
  if (!envelope) return;
  if (hasPackage()) return makeSettingsPackage(); // package editor with a zip from Alma: same zip, new settings.js
  if (errors.size) { setStatus(`Fix the ${errors.size} field(s) marked in red first:\n${[...errors.keys()].join(', ')}`, true); return; }
  const out = settingsOut('settings editor');
  const text = settingsJsText(out,
    'To change them, use the settings editor in this\n' +
    '  package — assets/editor/index.html — then replace this file with the one it\n' +
    '  downloads and upload the package again.');
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/javascript' })), download: 'settings.js' });
  document.body.append(a); a.click(); a.remove();
  setStatus('Downloaded. Now replace assets/settings.js in the package with it and upload the package (see "How to put the new settings live").');
}

/* ================================================================== MAKER
   Noob kit only ("START HERE.html" next to maker/kit.js). Builds a complete
   customization package from:
     - the package the library downloaded from Alma (their files: custom.css,
       homepage, header/footer, images … and assets/settings.js if the kit was
       installed before) — or nothing, for a brand-new package;
     - our code from the kit (KIT.files, replaced as a whole on every update);
     - the settings edited on this page (→ assets/settings.js).
   Everything happens in this browser (zip.js); nothing is uploaded anywhere.

   WHAT IS "OURS" in a package = KIT.coreRule (built by scripts/build-noob.cjs):
   the compiled .js/.css files at the top of the package folder (except
   custom.css) and assets/core/. Those are REMOVED before the kit's files are
   added, so files of an older version cannot pile up (their names change with
   every build). Everything else is kept untouched.

   ANOTHER CUSTOM MODULE: NDE loads one custom module per view. A package with
   a remoteEntry.js but without our assets/core/version.js was made by someone
   else (a developer, a vendor — or Ex Libris' empty template). The library must
   tick "replace it" before a package is made, because theirs is removed.
   ========================================================================= */
const maker = {
  sourceName: '',          // the zip the library dropped ('' = new package, none dropped)
  files: new Map(),        // their package: path inside the package folder → Uint8Array
  installed: null,         // { version, builtAt } of the kit already in their package, or null
  foreignModule: false,    // remoteEntry.js present but not ours
  replaceConfirmed: false, // "replace it" ticked
  settingsFrom: '',        // where the settings came from (shown in the summary)
  newPaths: new Set(),     // settings absent from their settings.js (dot paths) → "new" tag
  vid: '',                 // INST:VIEW
  done: '',                // file name of the last package made ('' = none yet)
};

/** Is this setting new for this package (not in its settings.js)? Always false outside maker mode. */
function isNew(path) { return !!KIT && maker.newPaths.has(path.join('.')); }

/** Plain object (not array/null)? */
const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const VID_RE = /^[A-Za-z0-9_]+:[A-Za-z0-9_-]+$/;

/** First screen: what this is, the steps, and where to drop the zip. */
function makerStart() {
  Object.assign(maker, { sourceName: '', files: new Map(), installed: null, foreignModule: false, replaceConfirmed: false,
    settingsFrom: '', newPaths: new Set(), vid: '', done: '', newest: null, zipDate: null, addStarter: null });
  envelope = null; values = null; original = null;
  errors.clear();
  document.title = t('Package maker — NOOB: NDE Out Of the Box');
  $('#title').textContent = t('Package maker — NOOB: NDE Out Of the Box');
  $('#subtitle').textContent = t('EC Library NDE kit · version {version}', { version: KIT.version });
  $('#open').textContent = t('Start again');
  $('#download').textContent = t('Make package');
  $('#download').disabled = true;
  setStatus(t('Drop the customization package from Alma to begin.'));

  if (!window.EcZip || !EcZip.supported()) {
    $('#main').replaceChildren(el('div', { class: 'maker-box warn' },
      el('h2', {}, t('This browser is too old')),
      // {page} = the file name of THIS page (START HERE / COMMENCER ICI / EMPEZAR AQUI).
      el('p', {}, t('The package maker needs a recent Microsoft Edge, Google Chrome or Firefox (2023 or later). Open "{page}" in one of those.',
        { page: decodeURIComponent(location.pathname.split('/').pop() || 'START HERE.html') }))));
    return;
  }

  const zone = el('div', { class: 'drop', tabindex: '0', role: 'button', 'aria-label': t('Choose the package zip') },
    el('p', {}, el('strong', {}, t('Drop the zip you downloaded from Alma here'))),
    el('p', { class: 'desc' }, t('or click to choose it. Do not unzip it first.')));
  const input = el('input', { type: 'file', accept: '.zip,application/zip', hidden: true,
    onchange: (e) => { if (e.target.files[0]) loadPackageZip(e.target.files[0]); e.target.value = ''; } });
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  zone.addEventListener('dragover', (e) => e.preventDefault());
  zone.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) loadPackageZip(e.dataTransfer.files[0]); });

  $('#main').replaceChildren(
    // Alma's menu names ("Manage Customization Package", …) stay in English in
    // every translation: Alma shows them in English unless the staff member set
    // another language there, and the English names are what they can search for.
    el('div', { class: 'maker-box' },
      el('h2', {}, t('What this does')),
      el('p', { style: 'margin:0' }, t('It adds the EC Library features to your Primo NDE view — or updates them — and lets you set them up, without any technical tools. You end up with one zip file to upload in Alma. Your own files in the package (styles, scripts, home page, header, footer, images) are kept as they are.'))),
    el('div', { class: 'maker-box' },
      el('h2', {}, t('Steps')),
      el('ol', { class: 'steps' },
        el('li', {}, ...rich('**Download your view\'s customization package from Alma.** In Alma, open your Primo NDE view, tab "Manage Customization Package". Under "Download Package", click "Download" next to "Current View Customization Package" (a zip file). If the page says "No Package Loaded", use "Start without a package" below.')),
        el('li', {}, ...rich('**Drop that zip below.** The page reads it; nothing is sent anywhere.')),
        el('li', {}, ...rich('**Check the settings, then click "Make package"** (bottom right). A new zip is downloaded.')),
        el('li', {}, ...rich('**Upload the new zip in Alma:** same tab, "Upload Package", choose the zip next to "Customization Package" and click "Upload". Primo shows the changes after a few minutes (reload the page).'))),
      el('p', { class: 'desc' }, t('To change settings later, or to install a newer kit: do the same again with the package from Alma.')),
      el('p', {}, ...rich('**Always start from a fresh download.** Never reuse an older zip from your Downloads folder: whatever was changed in the package since (a new image, an edited home page, settings) would be undone when you upload the result.')),
      // {readme} = the README in this page's language (README.txt / LISEZ-MOI.txt / LEAME.txt, from kit.js).
      el('p', { class: 'desc' }, t('Home page features (last search, loans due, account counts, parts for guests, signed-in visitors or your network), and a header and footer: see the examples in the kit\'s "examples" folder and {readme}, "Your home page". Colours follow the Color Theme picked for the view in Alma.',
        { readme: (UI && UI.readme) || 'README.txt' }))),
    zone, input,
    el('p', {}, el('button', { type: 'button', class: 'link', onclick: () => startWithoutPackage() }, t('Start without a package')),
      t(' — for a view that has no customization package yet.')));
}

/** Read the dropped zip and work out what is in it. */
async function loadPackageZip(file) {
  setStatus(t('Reading {file}…', { file: file.name }));
  let entries;
  try { entries = await EcZip.read(file); }
  catch (e) { setStatus(t('Could not open {file}: {error}', { file: file.name, error: e.message }), true); return; }
  // Leftovers of macOS zipping are never part of a package.
  entries = entries.filter((f) => !f.name.startsWith('__MACOSX/') && !/(^|\/)\.DS_Store$/.test(f.name));
  if (!entries.length) { setStatus(t('{file} is empty.', { file: file.name }), true); return; }

  // Alma packages hold one folder, <INST>-<VIEW>/. Tolerate zips made of the
  // folder's CONTENT (files at the top) too: then the folder name comes from the view code.
  const { root, files } = splitPackage(entries); // shared with the package editor (PACKAGE MODE)

  // How fresh is this zip? (shown in "Your package"; see staleWarning)
  //   newest — the most recent file date stored in the zip (when it was last changed in the package);
  //   zipDate — when the zip itself was saved on this computer, i.e. downloaded from Alma.
  const dated = entries.filter((f) => f.modified).sort((a, b) => b.modified - a.modified);
  const newest = dated.length ? { date: dated[0].modified, name: root ? dated[0].name.slice(root.length + 1) : dated[0].name } : null;
  const zipDate = file.lastModified ? new Date(file.lastModified) : null;

  // A zip of a whole kit or of anything else: refuse early, with a hint.
  if (files.has('START HERE.html') || files.has('maker/kit.js')) {
    setStatus(t('That is the kit itself. Drop the customization package downloaded from Alma.'), true); return;
  }

  const text = (p) => new TextDecoder('utf-8').decode(files.get(p));
  let installed = null;
  if (files.has('assets/core/version.js')) {
    try { const v = text('assets/core/version.js'); installed = JSON.parse(v.slice(v.indexOf('{'), v.lastIndexOf('}') + 1)); }
    catch { installed = { version: 'unknown' }; }
  }
  let env = null;
  if (files.has('assets/settings.js')) {
    try { env = parseSettings(text('assets/settings.js')); }
    catch (e) { setStatus(t('The settings in this package could not be read ({error}); starting from the default settings.', { error: e.message }), true); }
  }

  // View code: settings.js > folder name "INST-VIEW" > zip name "INST-VIEW.zip".
  const vid = (env && VID_RE.test(env.vid || '') && env.vid) || vidFromName(root) || vidFromName(file.name.replace(/\.zip$/i, '').replace(/\s*\(\d+\)$/, '')) || '';

  Object.assign(maker, { sourceName: file.name, files, installed, foreignModule: files.has('remoteEntry.js') && !installed,
    replaceConfirmed: false, done: '', newest, zipDate, addStarter: null });
  maker.settingsFrom = env ? t('from your package (last saved {date})', { date: formatDate(env.savedAt) }) : t('default settings (first installation)');
  begin(env, vid);
}

function startWithoutPackage() {
  Object.assign(maker, { sourceName: '', files: new Map(), installed: null, foreignModule: false, replaceConfirmed: false, done: '',
    settingsFrom: t('default settings (new package)') });
  begin(null, '');
}

/** Settings = kit defaults, with the package's own values on top; then show the form. */
function begin(env, vid) {
  maker.newPaths = new Set();
  if (env) migrateLegacySettings(env.values); // older package: today's shape first
  const merged = env ? mergeDefaults(KIT.defaults, env.values, []) : clone(KIT.defaults);
  if (!env) maker.newPaths.clear(); // first installation: everything is "new", no point in tagging it
  languages = env && Array.isArray(env.languages) && env.languages.length ? clone(env.languages) : clone(KIT.languages);
  // Texts in languages the package does not use (defaults are in en/fr/de) are dropped.
  const codes = languages.map((l) => l.code);
  (function strip(node) {
    if (!isObj(node)) return;
    const keys = Object.keys(node);
    if (keys.length && keys.includes('en') && keys.every((k) => /^[a-z]{2}$/.test(k))) { for (const k of keys) if (!codes.includes(k)) delete node[k]; return; }
    Object.values(node).forEach(strip);
  })(merged);

  maker.vid = vid;
  envelope = { format: 1, vid, view: vid.split(':')[1] || '', label: vid.split(':')[1] || '', values: merged };
  original = clone(merged);
  values = merged;
  originalLanguages = clone(languages);
  libraries = null; originalLibraries = null; // return labels are not part of the noob kit
  errors.clear();
  // The key 'view code' is internal (errors map); only the message is shown.
  if (!VID_RE.test(vid)) errors.set('view code', t('Enter the view code.'));
  $('#download').disabled = false;
  render();
  if (errors.has('view code')) setStatus(t('Enter the view code at the top (as in the Primo address after vid=).'), true);
  else setStatus(maker.foreignModule ? t('Read the warning at the top before making the package.') : t('Check the settings, then click "Make package".'));
}

/**
 * Kit defaults with the package's values on top. Only settings the kit knows
 * are kept (an old package may have settings that no longer exist); a value
 * of the wrong type falls back to the default. Settings missing from the
 * package are collected in maker.newPaths ("new" tag in the form).
 */
function mergeDefaults(def, have, path) {
  if (have === undefined) { if (path.length) maker.newPaths.add(path.join('.')); return clone(def); }
  if (isObj(def)) {
    if (!isObj(have)) return clone(def);
    const out = {};
    for (const k of Object.keys(def)) out[k] = mergeDefaults(def[k], have[k], [...path, k]);
    // Translated texts: keep languages the package has and the defaults do not (e.g. "it").
    const isText = Object.keys(def).length && Object.keys(def).every((k) => /^[a-z]{2}$/.test(k));
    if (isText) for (const [k, v] of Object.entries(have)) if (!(k in out) && /^[a-z]{2}$/.test(k) && typeof v === 'string') out[k] = v;
    return out;
  }
  if (Array.isArray(def) ? Array.isArray(have) : typeof def === typeof have) return clone(have);
  return clone(def);
}

/**
 * Warning box when the dropped zip looks old: saved on this computer (i.e.
 * downloaded from Alma) more than STALE_HOURS ago. The file date in the zip is
 * shown in "Your package" too, but Alma may stamp every file with the time it
 * made the zip, so the download date is the more reliable sign. null = fresh
 * enough, or no package dropped.
 */
const STALE_HOURS = 24;
/** `src` = the maker's state (default) or the package editor's `pkg` — both have sourceName, zipDate, done. */
function staleWarning(src = maker) {
  if (!src.sourceName || !src.zipDate || src.done) return null;
  const hours = (Date.now() - src.zipDate.getTime()) / 36e5;
  if (hours < STALE_HOURS) return null;
  const days = Math.floor(hours / 24);
  // Shared with the package editor (English only); the maker's texts are translated.
  const again = src === maker ? t('("Start again", bottom right)') : '("Open package or settings.js…", bottom right)';
  return el('div', { class: 'maker-box warn' },
    el('h2', {}, days === 1 ? t('This zip was downloaded yesterday') : t('This zip was downloaded {n} days ago', { n: days })),
    el('p', {}, t('{file} was saved on this computer on {date}. If anything changed in the package in Alma since then (an image, a page, the settings), the zip you make here would undo it. Unless you are sure nothing changed: download the package from Alma again and drop that one {again}.',
      { file: src.sourceName, date: formatDate(src.zipDate.toISOString()), again })));
}

/**
 * STARTER PAGES (KIT.starter, from src/noob/starter/): a clean home page,
 * header and footer that work as they are, for a package that has none of that
 * kind. Only the missing kinds are offered — a library's own file is never
 * replaced (any homepage_*.html counts as "has a home page", any header*.html
 * as "has a header", …). Ticked by default when ALL three are missing (a new
 * view), unticked otherwise.
 */
const STARTER_KINDS = [
  // label: already in the interface language (t() runs when this list is defined, after EC_UI has loaded).
  { path: 'assets/homepage/homepage_en.html', has: /^assets\/homepage\/homepage(_[a-z]{2})?\.html$/, label: t('home page') },
  { path: 'assets/header-footer/header.html', has: /^assets\/header-footer\/header(_[a-z]{2})?\.html$/, label: t('header') },
  { path: 'assets/header-footer/footer.html', has: /^assets\/header-footer\/footer(_[a-z]{2})?\.html$/, label: t('footer') },
];
/** Starter files this package lacks (path + label). */
function missingStarters() {
  if (!KIT || !KIT.starter) return [];
  const paths = [...maker.files.keys()];
  return STARTER_KINDS.filter((k) => KIT.starter[k.path] && !paths.some((p) => k.has.test(p)));
}
function starterPanel() {
  const missing = missingStarters();
  if (!missing.length || maker.done) return null;
  if (maker.addStarter === null) maker.addStarter = missing.length === STARTER_KINDS.length;
  const names = missing.map((k) => k.label);
  // "home page, header and footer" — the "and" is translated as a whole pattern.
  const list = names.length > 1 ? t('{first} and {last}', { first: names.slice(0, -1).join(', '), last: names[names.length - 1] }) : names[0];
  const box = el('input', { type: 'checkbox', id: 'add-starter', checked: maker.addStarter,
    onchange: (e) => { maker.addStarter = e.target.checked; } });
  const files = el('span', {}, ...missing.flatMap((k, i) => [i ? ', ' : '', el('code', {}, k.path)]));
  return el('div', { class: 'maker-box' },
    el('h2', {}, t('Your package has no {list}', { list })),
    el('p', {}, el('label', { for: 'add-starter' }, box, ' ', el('strong', {}, t('Add a starter {list}', { list }))),
      t(' — simple pages that work as they are, using the kit\'s features (welcome for guests and signed-in visitors, "pick up where you left off", loans due, account counts, opening hours). Replace the texts marked [YOUR …] later.')),
    el('p', { class: 'desc' }, ...rich('Files added: {files}. Primo shows the home page only when, in Alma, the view\'s Landing Page settings use the HTML file. The kit\'s examples folder has fuller examples of every feature.', { files })));
}

/** The boxes above the settings: summary, view code, warnings, next steps. */
function makerPanels() {
  const panels = [];
  const kept = [...maker.files.keys()].filter((p) => !isCorePath(p) && p !== 'assets/settings.js');
  const kit = maker.installed
    ? (maker.installed.version === KIT.version ? t('version {version} is installed — only the settings change', { version: KIT.version })
      : t('version {old} is installed → will be updated to {version}', { old: maker.installed.version, version: KIT.version }))
    : t('not installed yet → version {version} will be installed', { version: KIT.version });

  if (maker.done) {
    panels.push(el('div', { class: 'maker-box ok' },
      el('h2', {}, t('Done: {file} is in your Downloads folder', { file: maker.done })),
      el('ol', { class: 'steps' },
        el('li', {}, ...rich('In Alma, open the view {vid}, tab "Manage Customization Package" › "Upload Package": choose {file} and click "Upload".',
          { vid: el('code', {}, maker.vid), file: el('strong', {}, maker.done) })),
        el('li', {}, t('Wait a few minutes, then open the view in Primo and reload the page (Ctrl+F5).')),
        el('li', {}, t('Something wrong? Upload the zip you downloaded from Alma at the start again — that restores the previous state.'))),
      el('p', { class: 'desc' }, t('Changed your mind about a setting? Change it below and click "Make package" again.'))));
  }

  const vidInput = el('input', { type: 'text', value: maker.vid, placeholder: t('e.g. 44ABC_INST:MAIN'), 'aria-label': t('View code'), spellcheck: 'false' });
  const vidErr = el('p', { class: 'error' }, errors.get('view code') || '');
  vidInput.addEventListener('input', () => {
    const v = vidInput.value.trim();
    maker.vid = v; envelope.vid = v; envelope.view = envelope.label = v.split(':')[1] || '';
    const err = VID_RE.test(v) ? '' : t('Two parts separated by a colon: institution code, then view code (e.g. 44ABC_INST:MAIN).');
    if (err) errors.set('view code', err); else errors.delete('view code');
    vidErr.textContent = err;
    refreshStatus();
  });
  const n = maker.newPaths.size;
  panels.push(el('div', { class: 'maker-box' },
    el('h2', {}, t('Your package')),
    el('dl', {},
      el('dt', {}, t('Package from Alma')), el('dd', {}, maker.sourceName || t('none — a new package is made')),
      el('dt', {}, t('Your own files kept')), el('dd', {}, kept.length ? t('{n} (styles, pages, images …)', { n: kept.length }) : t('none')),
      maker.zipDate ? el('dt', {}, t('Downloaded')) : null,
      maker.zipDate ? el('dd', {}, formatDate(maker.zipDate.toISOString())) : null,
      maker.newest ? el('dt', {}, t('Newest file in it')) : null,
      maker.newest ? el('dd', {}, `${formatDate(maker.newest.date.toISOString())} (${maker.newest.name})`) : null,
      el('dt', {}, t('EC Library kit')), el('dd', {}, kit),
      el('dt', {}, t('Settings')), el('dd', {}, maker.settingsFrom,
        n === 1 ? t(' — 1 new setting in this version, marked "new" below') : n ? t(' — {n} new settings in this version, marked "new" below', { n }) : '')),
    el('div', { class: 'maker-vid' },
      el('label', {}, el('strong', {}, t('View code')), ' ', el('span', { class: 'desc' }, t('(as in the Primo address after vid=)'))),
      vidInput),
    vidErr));

  // An old zip? Warn — uploading its result would undo what changed in Alma since.
  const stale = staleWarning();
  if (stale) panels.push(stale);

  // Starter pages for a package without a home page / header / footer.
  const starterBox = starterPanel();
  if (starterBox) panels.push(starterBox);

  if (maker.foreignModule) {
    const box = el('input', { type: 'checkbox', id: 'replace-module', checked: maker.replaceConfirmed,
      onchange: (e) => { maker.replaceConfirmed = e.target.checked; refreshStatus(); } });
    panels.push(el('div', { class: 'maker-box warn', id: 'foreign' },
      el('h2', {}, t('This package already contains a custom module')),
      el('p', {}, t('Primo NDE can run only one custom module per view. The package you dropped has one that was not made with this kit (file remoteEntry.js). Making the package REMOVES it and puts the EC Library kit in its place.')),
      el('p', {}, t('If nobody built anything for your view, this is most likely the empty example that Ex Libris provides — then replacing it is fine. If a developer or a company made it for you, ask them first: their features would disappear.')),
      el('p', {}, box, ' ', el('label', { for: 'replace-module' }, el('strong', {}, t('Replace it with the EC Library kit'))))));
  }
  return panels;
}

/** Part of OUR code (removed before the kit's files are added)? Path is inside the package folder. */
function isCorePath(p) {
  const rule = KIT.coreRule;
  return (!p.includes('/') && new RegExp(rule.rootFiles).test(p)) || rule.folders.some((f) => p.startsWith(f));
}

/**
 * Starter assets/css/custom.css for a package that has no stylesheet of its
 * own yet — that is where Ex Libris' template keeps the library's styles, and
 * NDE loads it on every page (as it does assets/js/custom.js). Until Oct 2026
 * the maker created a custom.css at the package top instead; NDE loads that one
 * too, so packages that have it keep it and get no second file.
 */
const STARTER_CSS_PATH = 'assets/css/custom.css';
const STARTER_CSS =
  '/* assets/css/custom.css — YOUR OWN styles for this Primo view.\n' +
  '   The EC Library package maker never changes this file once it exists.\n' +
  '   Example — another colour for the kit\'s links and badges:\n' +
  '     :root { --ec-blue: #7a003c; }\n' +
  '*/\n';

async function makePackage() {
  if (!values) return;
  if (errors.size) { setStatus(t('Fix the field(s) marked in red first: {fields}', { fields: [...errors.keys()].join(', ') }), true); return; }
  if (maker.foreignModule && !maker.replaceConfirmed) {
    setStatus(t('Tick "Replace it with the EC Library kit" in the warning at the top first, or stop here.'), true);
    $('#foreign')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const folder = maker.vid.replace(':', '-');
  setStatus(t('Making the package…'));
  $('#download').disabled = true;
  try {
    const out = [];
    for (const [p, data] of maker.files) {
      if (p === 'assets/settings.js' || isCorePath(p)) continue; // old settings / old or foreign code
      out.push({ name: `${folder}/${p}`, data });
    }
    for (const [p, b64] of Object.entries(KIT.files)) {
      out.push({ name: `${folder}/${p}`, data: Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)) });
    }
    if (!maker.files.has(STARTER_CSS_PATH) && !maker.files.has('custom.css')) out.push({ name: `${folder}/${STARTER_CSS_PATH}`, data: STARTER_CSS });
    // Starter pages (see starterPanel): only the missing kinds, only when ticked.
    if (maker.addStarter) for (const k of missingStarters()) out.push({ name: `${folder}/${k.path}`, data: KIT.starter[k.path] });
    const env = { ...envelope, format: 1, vid: maker.vid, savedAt: new Date().toISOString(), savedBy: 'package maker',
      kitVersion: KIT.version, languages, values };
    out.push({ name: `${folder}/assets/settings.js`, data: settingsJsText(env,
      'To change them, run the package maker of the EC Library NDE kit ("START HERE.html")\n' +
      '  again with the package downloaded from Alma.') });

    const blob = await EcZip.write(out);
    const name = `${folder}.zip`;
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    maker.done = name;
    original = clone(values); originalLanguages = clone(languages);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setStatus(t('{file} downloaded — upload it in Alma (see the green box at the top).', { file: name }));
  } catch (e) {
    setStatus(t('The package could not be made: {error}', { error: e.message }), true);
  } finally {
    $('#download').disabled = false;
  }
}

/* ------------------------------------------------------------------ boot */
$('#advanced').addEventListener('change', applyAdvanced);
$('#download').addEventListener('click', download);
$('#open').addEventListener('click', () => (KIT ? makerStart() : $('#file').click())); // maker: "Start again"
$('#file').addEventListener('change', (e) => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; }); // zip or settings.js
window.addEventListener('beforeunload', (e) => {
  if (KIT ? values && !maker.done : values && (changedCount() || librariesChanged() || !same(languages, originalLanguages))) e.preventDefault();
});
start();
</script>
</body>
</html>
