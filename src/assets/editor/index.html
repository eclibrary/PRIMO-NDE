<!DOCTYPE html>
<!--
  SETTINGS EDITOR — ships in every view's customization package.

  For whom: library staff who change texts, links and switches of their view
  WITHOUT Node, npm, Git or a build. Open it from the live package:
      https://<primo host>/nde/custom/<INST>-<VIEW>/assets/editor/index.html
  or, offline, from an unzipped package (double-click this file).

  What it does:
    1. reads the CURRENT settings next to it (../settings.js) and the schema
       (schema.js, generated at build time — titles, descriptions, field types);
    2. shows them as a form, grouped in collapsible sections; technical fields
       (schema "x-advanced": true) only with "Show advanced settings"; HTML
       messages get a small WYSIWYG editor (rich-text.js, also used by the
       local settings UI);
       The Languages panel adds/removes languages (authoritative at runtime);
       the Return labels panel edits the label addresses per library code
       (settings.js "libraries", read by assets/return-label/label.js);
    3. checks the input and saves the result in one of two ways:
       a. PACKAGE ROUTE (recommended, Oct 2026): the user drops the view's
          package zip downloaded from Alma on the page, changes the settings
          and clicks "Make package" — the SAME zip comes back with only
          assets/settings.js replaced (every other file byte for byte, with its
          original date). Upload it in Alma. See the PACKAGE MODE section below.
          This is the safe way for non-developers to change an EC view: unlike
          the noob kit's maker it never touches the program files, so no
          feature can be lost.
       b. "Download settings.js": the user replaces assets/settings.js in the
          unzipped package by hand, zips the folder and uploads it.
  Another view's settings.js can also be loaded with "Open package or settings.js…".

  MAKER MODE (the noob zip, scripts/build-noob.cjs): the same page, saved as
  "START HERE.html" next to maker/kit.js (window.EC_KIT: schema, neutral
  defaults, our compiled code). Then it does not edit a settings.js but builds a
  whole customization package: the library drops the package downloaded from
  Alma, adjusts the settings, clicks "Make package" and uploads the result.
  See the MAKER section in the script below; everything else is shared.
  The kit also has this page as "COMMENCER ICI.html" (French) and
  "EMPEZAR AQUI.html" (Spanish): same page plus maker/ui-<lang>.js — see
  "interface language" in the script (t() / rich()) and src/noob/i18n/.

  No external resources, no network calls, nothing stored: plain HTML/CSS/JS so it
  also works from file://. The custom module reads settings.js as data (never
  executes it) — see src/app/shared/runtime-settings.ts. The file format is the
  same as written by scripts/config-generate.cjs (writeSettingsJs).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings editor</title>
<style>
  :root { --blue:#004494; --ink:#1b1b1b; --muted:#6b6b6b; --line:#d9d9d9; --bg:#f6f7f9; --ok:#1a7f37; --err:#b3261e; --warn:#8a5a00; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); padding-bottom:6rem; }
  header { background:var(--blue); color:#fff; padding:1rem 2rem; }
  header h1 { margin:0; font-size:1.3rem; font-weight:600; }
  header p { margin:.25rem 0 0; opacity:.85; font-size:.9rem; }
  main { max-width:62rem; margin:0 auto; padding:1.5rem 1rem; }
  .bar { position:fixed; inset:auto 0 0 0; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; padding:.75rem 2rem; background:#fff; border-top:1px solid var(--line); }
  .bar .status { flex:1; font-size:.9rem; color:var(--muted); }
  .bar .status.err { color:var(--err); white-space:pre-line; }
  button { font:inherit; cursor:pointer; padding:.5rem 1.1rem; border-radius:.5rem; border:1px solid var(--blue); background:var(--blue); color:#fff; }
  button.secondary { background:#fff; color:var(--blue); }
  button.link { border:0; background:none; color:var(--blue); padding:0; text-decoration:underline; }
  label.toggle { display:inline-flex; gap:.4rem; align-items:center; font-size:.9rem; }
  .intro, .help { background:#fff; border:1px solid var(--line); border-radius:.75rem; padding:1rem 1.25rem; margin-bottom:1rem; }
  .help ol { margin:.25rem 0 0; padding-left:1.25rem; }
  .help code, .intro code { background:#eef1f6; padding:.05rem .3rem; border-radius:.25rem; }
  details.section { background:#fff; border:1px solid var(--line); border-radius:.75rem; margin-bottom:.5rem; }
  details.section > summary { display:flex; gap:.6rem; align-items:center; padding:.75rem 1.25rem; cursor:pointer; list-style:none; }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section > summary::before { content:'▸'; color:var(--blue); transition:transform .15s; }
  details.section[open] > summary::before { transform:rotate(90deg); }
  details.section > summary h2 { margin:0; font-size:1.05rem; font-weight:600; }
  details.section[open] > summary { border-bottom:1px solid #eee; }
  .section-body { padding:.5rem 1.25rem 1rem; }
  .desc { color:var(--muted); font-size:.9rem; margin:.5rem 0; max-width:75ch; }
  .chip { font-size:.72rem; font-weight:600; padding:.1rem .5rem; border-radius:999px; background:#eceef2; color:var(--muted); text-transform:uppercase; }
  .chip.on { background:#dcf3e2; color:var(--ok); }
  .chip.changed { background:#fff1d6; color:var(--warn); text-transform:none; }
  .chip.new { background:#e3ecfa; color:var(--blue); margin-left:.35rem; }
  /* Maker mode (noob kit) */
  .maker-box { background:#fff; border:1px solid var(--line); border-radius:.75rem; padding:1rem 1.25rem; margin-bottom:1rem; }
  .maker-box h2 { margin:0 0 .5rem; font-size:1.1rem; }
  .maker-box.warn { border-color:#e0a800; background:#fffaf0; }
  .maker-box.ok { border-color:#9ad3a8; background:#f3fbf5; }
  .maker-box dl { display:grid; grid-template-columns:12rem 1fr; gap:.25rem 1rem; margin:.5rem 0 0; }
  .maker-box dt { color:var(--muted); }
  .maker-box dd { margin:0; }
  .maker-box ol { margin:.25rem 0 0; padding-left:1.25rem; }
  .maker-box ol li { margin:.2rem 0; }
  .maker-vid { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.5rem; }
  .maker-vid input { width:18rem; }
  .steps { counter-reset: step; list-style:none; padding:0; margin:.5rem 0 0; }
  .steps > li { counter-increment: step; position:relative; padding-left:2.2rem; margin:.6rem 0; }
  .steps > li::before { content: counter(step); position:absolute; left:0; top:-.05rem; width:1.6rem; height:1.6rem; border-radius:50%;
    background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; }
  .field { display:grid; grid-template-columns:15rem 1fr; gap:.5rem 1rem; padding:.6rem 0; border-top:1px solid #f0f0f0; }
  .field:first-child { border-top:0; }
  .field > .name { font-weight:500; }
  .field > .name small { display:block; font-weight:400; color:var(--muted); font-size:.8rem; line-height:1.35; }
  .field.changed > .name > label::after { content:' •'; color:var(--warn); font-weight:700; }
  .field.invalid input, .field.invalid textarea { border-color:var(--err); }
  .field .error { color:var(--err); font-size:.8rem; margin:.25rem 0 0; }
  input[type=text], input[type=url], input[type=number], select, textarea { width:100%; padding:.4rem .6rem; border:1px solid var(--line); border-radius:.375rem; font:inherit; background:#fff; }
  textarea { min-height:4rem; resize:vertical; }
  textarea.html { min-height:12rem; font-family:ui-monospace,Consolas,monospace; font-size:.85rem; }
  textarea.json { min-height:6rem; font-family:ui-monospace,Consolas,monospace; font-size:.85rem; }
  .lang { display:grid; grid-template-columns:5.5rem 1fr; gap:.5rem; align-items:start; margin-bottom:.35rem; }
  .lang > span { color:var(--muted); font-size:.85rem; padding-top:.45rem; }
  fieldset { border:1px solid var(--line); border-radius:.5rem; margin:.5rem 0; padding:.25rem .9rem .6rem; }
  legend { font-weight:600; padding:0 .25rem; }
  .advanced-hidden .adv { display:none; }
  .adv-tag { font-size:.7rem; color:var(--muted); border:1px solid var(--line); border-radius:.25rem; padding:0 .3rem; margin-left:.35rem; }
  .langs { display:flex; flex-wrap:wrap; gap:.4rem; margin:.5rem 0; }
  .lang-chip { display:inline-flex; gap:.35rem; align-items:center; padding:.2rem .6rem; border:1px solid var(--line); border-radius:999px; background:#f6f7f9; font-size:.9rem; }
  .lang-chip small { color:var(--muted); }
  .lang-add { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .lang-add input { width:auto; }
  /* Return labels: one card per library (code + remove | name + address lines). */
  .lib { display:grid; grid-template-columns:9rem 1fr; gap:.5rem 1rem; padding:.6rem 0; border-top:1px solid #f0f0f0; }
  .lib:first-of-type { border-top:0; }
  .lib .code { font-weight:600; font-family:ui-monospace,Consolas,monospace; padding-top:.4rem; }
  .lib .code button { display:block; margin-top:.35rem; font-size:.8rem; font-family:inherit; font-weight:400; }
  .lib textarea { margin-top:.35rem; min-height:5.5rem; }
  .lib.changed .code::after { content:' •'; color:var(--warn); font-weight:700; }
  .lib.invalid input { border-color:var(--err); }
  .lib .error { color:var(--err); font-size:.8rem; margin:.25rem 0 0; }
  /* Lists of objects (custom dialogs): one card per item. */
  .field.wide { grid-template-columns:1fr; }
  .objlist__item { margin:.25rem 0 .75rem; }
  .objlist__item > legend { display:flex; gap:1rem; align-items:baseline; }
  .objlist__remove { font-size:.85rem; font-weight:400; }
  .objlist__hint code { background:#eef1f6; padding:.05rem .3rem; border-radius:.25rem; }
  /* Tabbed lists ("x-tabs"): one item at a time. */
  .objlist--tabs .tabs { display:flex; flex-wrap:wrap; gap:.25rem; align-items:flex-end; border-bottom:1px solid var(--line); margin-bottom:.5rem; }
  .objlist--tabs .tab { border:1px solid var(--line); border-bottom:0; border-radius:.375rem .375rem 0 0; background:#f3f4f6; padding:.35rem .75rem; font:inherit; font-size:.9rem; cursor:pointer; color:var(--ink); max-width:16rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .objlist--tabs .tab[aria-selected="true"] { background:#fff; color:var(--blue); font-weight:600; position:relative; top:1px; }
  .objlist--tabs .tab.has-error { color:var(--err); }
  .objlist--tabs .tab.has-error::before { content:'! '; font-weight:700; }
  .objlist--tabs .tab-add { margin:0 0 .25rem .5rem; padding:.3rem .7rem; font-size:.9rem; }
  .objlist--tabs > .objlist__item { margin-top:0; }
  /* Colour fields (schema "format": "color"): swatch + #code + Clear. */
  .colour { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .colour input[type=color] { width:3rem; height:2.1rem; padding:.1rem; border:1px solid var(--line); border-radius:.375rem; background:#fff; cursor:pointer; }
  .colour input[type=text] { width:8rem; font-family:ui-monospace,Consolas,monospace; }
  .colour .unset { color:var(--muted); font-size:.85rem; }
  input[type=date] { padding:.35rem .5rem; border:1px solid var(--line); border-radius:.375rem; font:inherit; background:#fff; }
  /* Page tabs: Settings | HTML features (showPage / helpPanel). */
  .pagetabs { display:flex; gap:.25rem; max-width:62rem; margin:0 auto; padding:.75rem 1.5rem 0; border-bottom:1px solid var(--line); }
  .pagetabs button { border:1px solid var(--line); border-bottom:0; border-radius:.375rem .375rem 0 0; background:#eef1f6; padding:.45rem 1rem; font:inherit; cursor:pointer; color:var(--ink); }
  .pagetabs button[aria-selected="true"] { background:#fff; color:var(--blue); font-weight:600; position:relative; top:1px; }
  .help-page { max-width:62rem; margin:0 auto; padding:1rem 1.5rem 2rem; }
  .help-card { background:#fff; border:1px solid var(--line); border-radius:.75rem; padding:1rem 1.25rem; margin:0 0 .75rem; }
  .help-card h2 { font-size:1.05rem; margin:0 0 .35rem; display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap; }
  .help-card .needs { font-size:.75rem; font-weight:600; padding:.1rem .5rem; border-radius:1rem; background:#e3f5e6; color:#14421d; }
  .help-card .needs.setting { background:#fff4d6; color:#4d3800; }
  .help-card pre { background:#f6f7f9; border:1px solid var(--line); border-radius:.5rem; padding:.6rem .75rem; overflow:auto; font:.85rem/1.45 ui-monospace,Consolas,monospace; margin:.5rem 0 .25rem; white-space:pre; }
  .help-card .notes { margin:.35rem 0 0; padding-left:1.1rem; color:var(--muted); font-size:.9rem; }
  .drop { border:2px dashed var(--blue); border-radius:.75rem; padding:2rem; text-align:center; background:#fff; }
  /* Interface language links in the header (noob kit only: START HERE / COMMENCER ICI / EMPEZAR AQUI). */
  .uilangs { float:right; display:flex; gap:.75rem; font-size:.9rem; margin-top:.15rem; }
  .uilangs a { color:#fff; }
  .uilangs strong { border-bottom:2px solid #fff; }
  @media (max-width: 700px) { .field, .lib { grid-template-columns:1fr; } header, .bar { padding-left:1rem; padding-right:1rem; } }
</style>
<!-- ec:scripts -->
<!-- This block is REPLACED in the noob zip's "START HERE.html"
     (scripts/build-noob.cjs) by maker/kit.js + maker/zip.js + maker/rich-text.js.
     Keep the two marker comments. -->
<!-- The current settings and the schema. Both are optional at load: without
     settings.js the page offers to open one; without schema.js it explains. -->
<script src="../settings.js"></script>
<script src="schema.js"></script>
<!-- WYSIWYG for the HTML messages (shared with the local settings UI). -->
<script src="rich-text.js"></script>
<!-- "HTML features" tab: the markup-only features (shared with the settings UI and FOR-CLAUDE.md). -->
<script src="markup-help.js"></script>
<!-- Zip reader/writer for the package route ("Make package", see PACKAGE MODE).
     Optional: without it only "Download settings.js" is offered. -->
<script src="zip.js"></script>
<!-- /ec:scripts -->
</head>
<body>
<header>
  <!-- Links to the same page in the other interface languages (noob kit only;
       filled by initUiLanguages() from KIT.uiLanguages). -->
  <nav id="uilangs" class="uilangs" aria-label="Language" hidden></nav>
  <h1 id="title">Settings editor</h1>
  <p id="subtitle">Loading…</p>
</header>
<!-- Page tabs: the settings, and the reference of HTML features (markup-help.js).
     Shown once settings are loaded; see showPage(). -->
<nav id="pagetabs" class="pagetabs" role="tablist" aria-label="Page" hidden>
  <button type="button" role="tab" id="tab-settings" aria-selected="true">Settings</button>
  <button type="button" role="tab" id="tab-help" aria-selected="false">HTML features</button>
</nav>
<main id="main"></main>
<section id="help" class="help-page" hidden></section>
<div class="bar">
  <span id="status" class="status"></span>
  <label class="toggle"><input type="checkbox" id="advanced"> <span id="advanced-label">Show advanced settings</span></label>
  <button type="button" class="secondary" id="open">Open package or settings.js…</button>
  <button type="button" id="download">Download settings.js</button>
  <!-- The package zip from Alma (package route) or a bare settings.js; see openFile(). -->
  <input type="file" id="file" accept=".zip,application/zip,.js,text/javascript" hidden>
</div>

<script>
'use strict';
/* ------------------------------------------------------------------ state */
/** The noob kit (maker/kit.js) — present only in "START HERE.html" = maker mode. */
const KIT = window.EC_KIT || null;
const schema = KIT ? KIT.schema : window.EC_SCHEMA || null;
// UI languages: from settings.js when it has them (the editor can add/remove
// languages), else the list the package was built with (schema.js / kit.js).
let languages = (KIT ? KIT.languages : window.EC_LANGUAGES) || [{ code: 'en', name: 'English' }];
let originalLanguages = clone(languages);
let envelope = KIT ? null : window.EC_SETTINGS || null;   // { format, vid, view, label, savedAt, savedBy, languages, values, libraries }
// Return addresses per Alma library code, for the "Print return label" page
// (assets/return-label/, which reads them from settings.js). null = this
// settings.js has none (made by an older package): the panel then only explains.
let libraries = null;
let originalLibraries = null;
let original = null;                          // values as loaded (to show what changed)
let values = null;                            // working copy, edited by the form
const errors = new Map();                     // path → message (invalid fields)

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }

/* ------------------------------------------------------- interface language
   The PAGE's own language (buttons, help, setting titles) — not to be confused
   with `languages` above, the languages of the library's Primo view.

   Noob kit only (Oct 2026): besides "START HERE.html" (English) the kit has
   "COMMENCER ICI.html" (French) and "EMPEZAR AQUI.html" (Spanish). They are
   this same page; each also loads maker/ui-<lang>.js, which sets
       window.EC_UI = { lang: 'fr', strings: { "<English text>": "<translation>", … } }
   (built by scripts/build-noob.cjs from src/noob/i18n/<lang>.json). Without
   EC_UI — the English page, and the settings editor inside the EC views —
   every text simply stays English.

   HOW TO WRITE A TEXT IN THIS FILE so that it can be translated:
     t('Plain text with {placeholders}.', { placeholders: value })
     rich('Text with **bold**, `code` and {node} parts.', { node: someElement })
   - The English text IS the key in the dictionaries. Change it here and the
     old translation no longer matches: the page shows English and the noob
     build lists the text as "not translated" — then update src/noob/i18n/*.json.
   - Always pass a LITERAL string in single quotes (no template literals, no
     ternary inside the call): build-noob.cjs finds the texts to translate by
     scanning this file for t('…') and rich('…'). For a choice, write
     n === 1 ? t('…') : t('…').
   - Whole sentences, not fragments: word order differs between languages,
     which is why rich() exists instead of gluing el('strong') pieces together.
   - Setting titles and help texts come from the schema and are translated in
     one go by translateSchema(); the "HTML features" entries by
     translateMarkupHelp(). Same dictionaries.
   Package-editor-only texts (PACKAGE MODE, Return labels) are not wrapped:
   that editor ships only in the EC views, in English.
   ------------------------------------------------------------------------- */
const UI = window.EC_UI && typeof window.EC_UI === 'object' ? window.EC_UI : null;
const UI_STRINGS = (UI && UI.strings) || {};

/** Translate `text` (English) and fill its {placeholders} from `vars`. */
function t(text, vars) {
  let s = Object.prototype.hasOwnProperty.call(UI_STRINGS, text) && UI_STRINGS[text] ? UI_STRINGS[text] : text;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return s;
}

/**
 * Translate `text` and turn it into nodes for el(): **bold** → <strong>,
 * `code` → <code>, {name} → vars.name (a string, or a DOM node such as a
 * <code> or <strong> element). Returns an array (el() flattens it).
 */
function rich(text, vars = {}) {
  const s = t(text); // placeholders are filled below, so a node can be inserted
  const fill = (part) => part.replace(/\{(\w+)\}/g, (m, k) => (k in vars && !(vars[k] && vars[k].nodeType) ? String(vars[k]) : m));
  return s.split(/(\*\*[^*]+\*\*|`[^`]+`|\{\w+\})/).filter(Boolean).map((part) => {
    if (part.startsWith('**') && part.endsWith('**')) return el('strong', {}, fill(part.slice(2, -2)));
    if (part.startsWith('`') && part.endsWith('`')) return el('code', {}, fill(part.slice(1, -1)));
    const m = /^\{(\w+)\}$/.exec(part);
    if (m && m[1] in vars) return vars[m[1]] && vars[m[1]].nodeType ? vars[m[1]] : String(vars[m[1]]);
    return fill(part);
  });
}

/**
 * Translate the schema's human texts in place: title, description,
 * x-patternHint, x-tabEmptyLabel, x-enumNames and the labels of x-choices.
 * Keys, enum VALUES and defaults are never touched (they are data).
 * Runs once at start-up, before anything is drawn; no-op without EC_UI.
 */
function translateSchema(node, seen = new Set()) {
  if (!UI || !node || typeof node !== 'object' || seen.has(node)) return;
  seen.add(node);
  if (Array.isArray(node)) { node.forEach((n) => translateSchema(n, seen)); return; }
  for (const k of ['title', 'description', 'x-patternHint', 'x-tabEmptyLabel']) if (typeof node[k] === 'string') node[k] = t(node[k]);
  if (Array.isArray(node['x-enumNames'])) node['x-enumNames'] = node['x-enumNames'].map((n) => (typeof n === 'string' ? t(n) : n));
  if (Array.isArray(node['x-choices'])) node['x-choices'].forEach((c) => { if (c && typeof c.label === 'string') c.label = t(c.label); });
  for (const [k, v] of Object.entries(node)) if (k !== 'default' && k !== 'enum' && v && typeof v === 'object') translateSchema(v, seen);
}

/** Same for the "HTML features" entries (markup-help.js). The example code stays as it is. */
function translateMarkupHelp() {
  if (!UI || !Array.isArray(window.EC_MARKUP_HELP)) return;
  window.EC_MARKUP_HELP = window.EC_MARKUP_HELP.map((h) => ({ ...h,
    title: t(h.title), what: t(h.what), needs: h.needs ? t(h.needs) : h.needs,
    notes: Array.isArray(h.notes) ? h.notes.map((n) => t(n)) : h.notes }));
}

/**
 * Header links to the same page in the other interface languages, from
 * KIT.uiLanguages = [{ code, name, page }] (build-noob.cjs). The current one
 * is shown in bold, not as a link. Switching asks first when there are
 * unsaved changes (the beforeunload handler at the bottom).
 */
function initUiLanguages() {
  const list = KIT && Array.isArray(KIT.uiLanguages) ? KIT.uiLanguages : [];
  if (list.length < 2) return;
  const current = (UI && UI.lang) || 'en';
  const nav = $('#uilangs');
  nav.setAttribute('aria-label', t('Language of this page'));
  nav.replaceChildren(...list.map((l) => (l.code === current
    ? el('strong', { lang: l.code }, l.name)
    : el('a', { href: encodeURI(l.page), lang: l.code, hreflang: l.code }, l.name))));
  nav.hidden = false;
}

/** The static texts of the page (HTML above) in the interface language. */
function translateStaticTexts() {
  if (UI && UI.lang) document.documentElement.lang = UI.lang;
  $('#tab-settings').textContent = t('Settings');
  $('#tab-help').textContent = t('HTML features');
  $('#pagetabs').setAttribute('aria-label', t('Page'));
  $('#advanced-label').textContent = t('Show advanced settings');
}

const same =(a, b) => JSON.stringify(a) === JSON.stringify(b);
const getPath = (o, p) => p.reduce((x, k) => (x == null ? undefined : x[k]), o);
function setPath(o, p, v) { let x = o; for (const k of p.slice(0, -1)) { if (x[k] == null || typeof x[k] !== 'object') x[k] = {}; x = x[k]; } x[p[p.length - 1]] = v; }

/* ----------------------------------------------------------- schema utils */
/** Follow $ref; keys next to the $ref (title, description, format, x-advanced) win. */
function resolve(s) {
  if (!s || !s.$ref) return s || {};
  const target = s.$ref.replace('#/', '').split('/').reduce((o, k) => o && o[k], schema);
  const { $ref, ...extra } = s;
  return { ...resolve(target), ...extra };
}
const langCodes = () => languages.map((l) => l.code);
/**
 * Object schema whose properties are language codes = a translated value.
 * Recognised by the keys being two-letter codes incl. "en" — not by comparing
 * with the current language list, which the user can change in this editor.
 */
function isLocalised(s) {
  const keys = Object.keys(s.properties || {});
  return s.type === 'object' && keys.length > 0 && keys.includes('en') && keys.every((k) => /^[a-z]{2}$/.test(k));
}
function kind(s) {
  if (s.type === 'boolean') return 'boolean';
  if (s.type === 'integer' || s.type === 'number') return 'number';
  if (s.type === 'string' && s.enum) return 'enum';
  // "format" picks a special input; the value stays a plain string in settings.js.
  if (s.type === 'string' && s.format === 'color') return 'color'; // colour picker ("#rrggbb" or "")
  if (s.type === 'string' && s.format === 'date') return 'date';   // date picker ("YYYY-MM-DD" or "")
  if (s.type === 'string' && s.format === 'code') return 'code';   // embed code: big monospace box
  if (s.type === 'string') return 'string';
  if (s.type === 'array' && resolve(s.items || {}).type === 'string') return 'list';
  // A list of objects (e.g. custom dialogs): cards with Add / Remove.
  if (s.type === 'array' && resolve(s.items || {}).type === 'object') return 'objlist';
  if (s.type === 'object' && isLocalised(s)) return 'localised';
  if (s.type === 'object' && s.properties) return 'object';
  return 'json'; // free-form maps and anything else: edited as JSON (advanced)
}

/* --------------------------------------------------------------- loading */
function start() {
  // Interface language first (noob kit's COMMENCER ICI / EMPEZAR AQUI): every
  // text drawn after this point is already translated.
  translateSchema(schema);
  translateMarkupHelp();
  translateStaticTexts();
  initUiLanguages();
  if (!schema) {
    $('#subtitle').textContent = 'schema.js is missing next to this page.';
    $('#main').append(el('div', { class: 'intro' },
      'This editor needs the file schema.js in the same folder. It is created when the package is built. ',
      'Open the editor from the package (assets/editor/index.html), not from a copy of this page on its own.'));
    $('#download').disabled = true;
    return;
  }
  if (KIT) return makerStart();      // noob kit: build a package (MAKER section)
  if (!envelope) return showDropZone();
  load(envelope);
}

/**
 * Bring settings from an OLDER package into today's shape (in place). Twin of
 * migrateLegacySettings in src/app/shared/runtime-settings.ts (what Primo does
 * when it reads settings.js) and in scripts/settings-ui/server.cjs — keep the
 * three in step.
 */
function migrateLegacySettings(v) {
  // Oct 2026 — one collection badge → a list of badges (libraryOnTheGo.badges).
  const lotg = v && v.libraryOnTheGo;
  if (isObj(lotg) && !('badges' in lotg) && 'collectionId' in lotg) {
    const badge = {};
    for (const k of ['collectionId', 'label', 'color', 'infoButtonLabel', 'dialogTitle', 'dialogHtml']) {
      if (k in lotg) badge[k] = lotg[k];
      delete lotg[k];
    }
    delete lotg.pnxEndpoint; // a constant in the module now
    lotg.badges = [badge];
  }

  // Oct 2026 — custom dialogs: `name` (plain word) became `selector` ("Opens from").
  const dialogs = v && v.customDialogs && v.customDialogs.dialogs;
  if (Array.isArray(dialogs)) {
    for (const d of dialogs) {
      if (!d || typeof d !== 'object' || !('name' in d)) continue;
      const name = String(d.name ?? '').trim();
      const sel = String(d.selector ?? '').trim();
      d.selector = name && sel ? `a[href="#${name}"], .${name}, ${sel}` : (sel || name);
      delete d.name;
    }
  }

  // Oct 2026 — Ask a librarian without the Europa helper script (see runtime-settings.ts).
  const ask = v && v.askALibrarian;
  if (ask && typeof ask === 'object' && ('widgetId' in ask || 'prefillFromUser' in ask)) {
    const id = String((ask.widgetId && ask.widgetId.en) || '').trim();
    const host = String(ask.libanswersHost || '').trim().replace(/\/+$/, '');
    if ('widgetId' in ask && !('widgetCode' in ask)) {
      ask.widgetCode = id && host ? `<div id="s-la-widget-${id}"></div>\n<script src="${host}/1.0/widgets/${id}"><\/script>` /* <\/script>: a literal closing tag would end this page's own <script> */ : '';
      ask.useDialog = !!(id && host);
    }
    const map = ask.prefillFromUser;
    if (map && typeof map === 'object' && !Array.isArray(map)) {
      const custom = [];
      ask.prefillName = false;
      ask.prefillEmail = false;
      for (const [field, source] of Object.entries(map)) {
        if (source === 'displayName') { ask.prefillName = true; ask.nameField = field; }
        else if (source === 'email') { ask.prefillEmail = true; ask.emailField = field; }
        else custom.push({ field, source: String(source) });
      }
      ask.customPrefills = custom;
    }
    if (!('addContext' in ask)) ask.addContext = true;
    for (const k of ['widgetId', 'libanswersHost', 'formfillScriptUrl', 'prefillFromUser', 'prefillStatic', 'hideFields', 'formCssPath']) delete ask[k];
  }
  return v;
}

function load(env) {
  migrateLegacySettings(env.values);
  envelope = env;
  original = clone(env.values || {});
  values = clone(env.values || {});
  if (Array.isArray(env.languages) && env.languages.length) languages = clone(env.languages);
  originalLanguages = clone(languages);
  const libs = env.libraries;
  libraries = libs && typeof libs === 'object' && !Array.isArray(libs) ? clone(libs) : null;
  originalLibraries = clone(libraries);
  errors.clear();
  $('#title').textContent = `Settings — ${env.label || env.view || 'view'}`;
  $('#subtitle').textContent = `${env.vid || 'unknown view'} · last saved by ${env.savedBy || '?'}, ${formatDate(env.savedAt)}`;
  document.title = `Settings — ${env.label || env.view || ''}`;
  render();
}

function showDropZone() {
  $('#subtitle').textContent = 'No settings loaded.';
  const zone = el('div', { class: 'drop' },
    el('p', {}, el('strong', {}, 'Drop the package of the view you want to change.')),
    el('p', { class: 'desc' }, 'The zip downloaded from Alma (recommended: you get a package to upload back), ',
      'or the settings.js from the package\'s assets folder. Or use "Open package or settings.js…".'));
  zone.addEventListener('dragover', (e) => e.preventDefault());
  zone.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
  $('#main').replaceChildren(zone);
}

/** Same parser as the custom module: the JSON between the first "{" after EC_SETTINGS and the last "}". */
function parseSettings(text) {
  const start = text.indexOf('{', text.indexOf('EC_SETTINGS'));
  const end = text.lastIndexOf('}');
  if (start < 0 || end <= start) throw new Error(t('This is not a settings.js file.'));
  const env = JSON.parse(text.slice(start, end + 1));
  if (!env || typeof env.values !== 'object') throw new Error(t('The file has no settings in it.'));
  return env;
}
function readFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const env = parseSettings(String(r.result));
      resetPackage(); // a bare settings.js: back to the "Download settings.js" route
      load(env);
      setStatus(`Opened ${file.name}.`);
    } catch (e) { setStatus(`Could not open ${file.name}: ${e.message}`, true); }
  };
  r.readAsText(file);
}

/** A file from the drop zone or "Open package or settings.js…": zip → package route, else settings.js. */
function openFile(file) {
  if (/\.zip$/i.test(file.name) || /zip/i.test(file.type || '')) loadOwnPackage(file);
  else readFile(file);
}

/* ============================================================ PACKAGE MODE
   The editor INSIDE a view's package (not the noob kit's maker): change the
   settings of the package downloaded from Alma and get the same package back.

     1. the user drops the view's zip from Alma (Manage Customization Package ›
        Download Package › Current View Customization Package);
     2. loadOwnPackage() reads it (zip.js) and CHECKS it:
          - the noob kit itself, or a package made with the kit
            (assets/core/version.js) → refused: those are changed with the
            kit's own package maker ("START HERE.html");
          - no assets/settings.js or no assets/editor/ → refused: not a package
            built from this repository;
          - another view than the one this editor shows (its settings.js "vid",
            else the folder name) → refused, naming both views, so the
            Publications zip cannot be dropped on Find-eR's editor by mistake;
        then loads the settings FROM THE ZIP (a fresh download is the truth;
        the settings.js next to this page may be older or newer);
     3. the user changes settings; the bar button reads "Make package";
     4. makeSettingsPackage() writes every file of the zip back unchanged —
        same names, same bytes, same dates (zip.js `modified`) — except
        assets/settings.js, and downloads it under the zip's folder name.

   What it never does: add, remove or replace program files (remoteEntry.js,
   chunks), styles, pages or images. That is the point: a colleague can change
   texts and switches of an EC view without any risk to its features.
   Shares staleWarning() (old download) with the maker.
   ========================================================================= */
const pkg = {
  sourceName: '',   // file name of the dropped zip ('' = no package loaded)
  root: '',         // the package folder inside the zip ("<INST>-<VIEW>"), '' = files at the top
  entries: [],      // every file of the zip as read: { name (full path in the zip), data, modified }
  zipDate: null,    // when the zip was saved on this computer (≈ downloaded from Alma)
  newest: null,     // { date, name } — most recent file date inside the zip
  done: '',         // file name of the last package made ('' = none yet)
};

/** Is a package from Alma loaded (package route)? Never in maker mode. */
function hasPackage() { return !KIT && pkg.entries.length > 0; }

/** Forget the loaded package (e.g. when a bare settings.js is opened instead). */
function resetPackage() {
  Object.assign(pkg, { sourceName: '', root: '', entries: [], zipDate: null, newest: null, done: '' });
}

/**
 * Alma packages hold ONE folder, <INST>-<VIEW>/. A zip made of the folder's
 * CONTENT (files at the top) is tolerated: root is then ''. Shared with the
 * maker (loadPackageZip). Returns { root, files: Map(path inside the folder → data) }.
 */
function splitPackage(entries) {
  const tops = new Set(entries.map((f) => f.name.split('/')[0]));
  const root = tops.size === 1 && entries.every((f) => f.name.includes('/')) ? [...tops][0] : '';
  return { root, files: new Map(entries.map((f) => [root ? f.name.slice(root.length + 1) : f.name, f.data])) };
}

/** "INST-VIEW" (folder or zip name) → "INST:VIEW", or ''. */
function vidFromName(n) {
  const m = /^([A-Za-z0-9_]+)-([A-Za-z0-9_-]+)$/.exec(n || '');
  return m ? `${m[1]}:${m[2]}` : '';
}

/** Read and check a dropped package zip, then load its settings (see PACKAGE MODE). */
async function loadOwnPackage(file) {
  if (!window.EcZip || !EcZip.supported()) {
    setStatus('This browser cannot open zip files. Use a recent Edge, Chrome or Firefox — or open the package\'s assets/settings.js instead.', true);
    return;
  }
  // Unsaved edits on the page would be replaced by the zip's settings: ask first.
  if (values && (changedCount() || librariesChanged() || !same(languages, originalLanguages))
      && !confirm('The settings in this package replace the changes you made on this page so far. Continue?')) return;

  setStatus(`Reading ${file.name}…`);
  let entries;
  try { entries = await EcZip.read(file); }
  catch (e) { setStatus(`Could not open ${file.name}: ${e.message}`, true); return; }
  // Leftovers of macOS zipping are never part of a package.
  entries = entries.filter((f) => !f.name.startsWith('__MACOSX/') && !/(^|\/)\.DS_Store$/.test(f.name));
  if (!entries.length) { setStatus(`${file.name} is empty.`, true); return; }

  const { root, files } = splitPackage(entries);
  const refuse = (msg) => { setStatus(msg, true); };

  // The checks — each with what to do instead.
  if (files.has('START HERE.html') || files.has('maker/kit.js')) {
    return refuse('That is the NDE kit itself, not a package. Drop the zip of this view downloaded from Alma.');
  }
  if (files.has('assets/core/version.js')) {
    return refuse(`${file.name} was made with the NDE kit (START HERE.html). Change its settings with the kit's package maker, not here.`);
  }
  if (!files.has('assets/settings.js') || !files.has('assets/editor/index.html')) {
    return refuse(`${file.name} is not a package built from the EC Library NDE repository (no assets/settings.js or settings editor in it). ` +
      'Drop the zip of this view downloaded from Alma: Manage Customization Package › Download Package › Current View Customization Package.');
  }
  let env;
  try { env = parseSettings(new TextDecoder('utf-8').decode(files.get('assets/settings.js'))); }
  catch (e) { return refuse(`The settings in ${file.name} could not be read: ${e.message}`); }

  // Same view as this editor? (the view shown in the title: settings.js next to
  // the page, or whatever was opened last). Unknown on either side → accept.
  const zipVid = env.vid || vidFromName(root) || vidFromName(file.name.replace(/\.zip$/i, '').replace(/\s*\(\d+\)$/, ''));
  const mine = envelope && envelope.vid;
  if (mine && zipVid && zipVid !== mine) {
    return refuse(`${file.name} is the package of ${zipVid}, but this editor shows ${mine}. ` +
      `Drop the zip of ${mine} — or open the settings editor of ${zipVid} (assets/editor/index.html in that view's package).`);
  }

  // Freshness, as in the maker (see staleWarning): the download date, and the newest file date inside.
  const dated = entries.filter((f) => f.modified).sort((a, b) => b.modified - a.modified);
  const newest = dated.length ? { date: dated[0].modified, name: root ? dated[0].name.slice(root.length + 1) : dated[0].name } : null;
  Object.assign(pkg, { sourceName: file.name, root, entries, newest, done: '',
    zipDate: file.lastModified ? new Date(file.lastModified) : null });

  if (!env.vid && zipVid) env.vid = zipVid; // older settings.js without a view code
  load(env);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setStatus(`${file.name} read. Change the settings, then click "Make package".`);
}

/**
 * The boxes at the top of the page (package editor, not the maker): before a
 * package is dropped, the two ways to save; after, "Your package" (+ an old-
 * download warning); after "Make package", the upload steps.
 */
function packagePanels() {
  const vid = envelope.vid || '<INST>:<VIEW>';
  const folder = vid.replace(':', '-');
  if (!hasPackage()) {
    // Not loaded yet: drop zone for the package route + the settings.js route as an alternative.
    const zone = el('div', { class: 'drop', tabindex: '0', role: 'button', 'aria-label': 'Choose the package zip' },
      el('p', {}, el('strong', {}, `Drop the zip of ${vid} downloaded from Alma here`)),
      el('p', { class: 'desc' }, 'or click to choose it. Do not unzip it. Nothing is sent anywhere.'));
    const input = el('input', { type: 'file', accept: '.zip,application/zip', hidden: true,
      onchange: (e) => { if (e.target.files[0]) loadOwnPackage(e.target.files[0]); e.target.value = ''; } });
    zone.addEventListener('click', () => input.click());
    zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    zone.addEventListener('dragover', (e) => e.preventDefault());
    zone.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) loadOwnPackage(e.dataTransfer.files[0]); });
    const zipOk = !!(window.EcZip && EcZip.supported());
    return [
      el('div', { class: 'maker-box' },
        el('h2', {}, 'Change the settings of this view'),
        zipOk ? el('ol', { class: 'steps' },
          el('li', {}, el('strong', {}, 'In Alma, download this view\'s package: '),
            'open the view ', el('code', {}, vid), ', tab "Manage Customization Package" › "Download Package" › ',
            '"Download" next to "Current View Customization Package". Always use a fresh download.'),
          el('li', {}, el('strong', {}, 'Drop that zip below. '), 'Its settings are loaded into this page.'),
          el('li', {}, el('strong', {}, 'Change the settings, then click "Make package" '),
            '(bottom right). You get the same zip back with only the settings changed — nothing else in the package is touched.'),
          el('li', {}, el('strong', {}, 'Upload it in Alma: '), 'same tab, "Upload Package" › "Customization Package". ',
            'Primo shows the changes after a few minutes (reload the page).'))
          : el('p', {}, 'This browser cannot handle zip files, so use "Download settings.js" (below).'),
        zipOk ? zone : null, zipOk ? input : null),
      el('details', { class: 'help' },
        el('summary', {}, el('strong', {}, 'Or: download settings.js only, and put it in the package yourself')),
        el('ol', {},
          el('li', {}, 'Change the settings below, then click ', el('strong', {}, 'Download settings.js'), '.'),
          el('li', {}, 'In Alma, download the current customization package of this view (a zip file).'),
          el('li', {}, 'Unzip it. You get a folder ', el('code', {}, folder), '.'),
          el('li', {}, 'Replace the file ', el('code', {}, `${folder}/assets/settings.js`), ' with the settings.js you downloaded here.'),
          el('li', {}, 'Zip the folder ', el('code', {}, folder), ' again (right-click the folder → Send to → Compressed (zipped) folder).'),
          el('li', {}, 'Upload that zip in Alma as the view\'s customization package. Changes show after a few minutes (reload the page).'))),
    ];
  }

  const panels = [];
  if (pkg.done) {
    panels.push(el('div', { class: 'maker-box ok' },
      el('h2', {}, `Done: ${pkg.done} is in your Downloads folder`),
      el('ol', { class: 'steps' },
        el('li', {}, 'In Alma, open the view ', el('code', {}, vid), ', tab "Manage Customization Package" › "Upload Package": choose ',
          el('strong', {}, pkg.done), ' next to "Customization Package" and click "Upload".'),
        el('li', {}, 'Wait a few minutes, then open the view in Primo and reload the page (Ctrl+F5).'),
        el('li', {}, 'Something wrong? Upload the zip you downloaded from Alma at the start (', el('strong', {}, pkg.sourceName),
          ') again — that restores the previous state.')),
      el('p', { class: 'desc' }, 'Changed your mind about a setting? Change it below and click "Make package" again.')));
  }
  panels.push(el('div', { class: 'maker-box' },
    el('h2', {}, 'Your package'),
    el('dl', {},
      el('dt', {}, 'Package from Alma'), el('dd', {}, pkg.sourceName),
      el('dt', {}, 'View'), el('dd', {}, vid),
      pkg.zipDate ? el('dt', {}, 'Downloaded') : null,
      pkg.zipDate ? el('dd', {}, formatDate(pkg.zipDate.toISOString())) : null,
      pkg.newest ? el('dt', {}, 'Newest file in it') : null,
      pkg.newest ? el('dd', {}, `${formatDate(pkg.newest.date.toISOString())} (${pkg.newest.name})`) : null,
      el('dt', {}, 'What changes'), el('dd', {}, `only assets/settings.js — the other ${pkg.entries.length - 1} files stay exactly as they are`)),
    el('p', { class: 'desc' }, 'Wrong zip? Drop another one with "Open package or settings.js…" (bottom right).')));
  const stale = staleWarning(pkg);
  if (stale) panels.push(stale);
  return panels;
}

/** "Make package" in the package editor: the dropped zip with only assets/settings.js replaced. */
async function makeSettingsPackage() {
  if (errors.size) { setStatus(`Fix the ${errors.size} field(s) marked in red first:\n${[...errors.keys()].join(', ')}`, true); return; }
  const folder = pkg.root || (envelope.vid || '').replace(':', '-');
  if (!folder) { setStatus('This package has no view code, so it cannot be named. Download settings.js instead.', true); return; }
  const text = settingsJsText(settingsOut('settings editor (package)'),
    'To change them, open the settings editor of this package\n' +
    '  (assets/editor/index.html), drop the package downloaded from Alma on it,\n' +
    '  change the settings and click "Make package"; upload the result.');
  // Files at the top of the zip (no folder) go into the folder Alma expects.
  const inFolder = (name) => (pkg.root ? name : `${folder}/${name}`);
  const settingsPath = `${folder}/assets/settings.js`;
  setStatus('Making the package…');
  $('#download').disabled = true;
  try {
    // Same order, names, bytes and dates as the dropped zip; only settings.js is new.
    const out = pkg.entries.map((f) => (inFolder(f.name) === settingsPath
      ? { name: settingsPath, data: text }                                   // the new settings (dated now)
      : { name: inFolder(f.name), data: f.data, modified: f.modified }));    // untouched
    const blob = await EcZip.write(out);
    const name = `${folder}.zip`;
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    pkg.done = name;
    // What was just packaged is the new "original": the change markers reset.
    original = clone(values); originalLanguages = clone(languages); originalLibraries = clone(libraries);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setStatus(`${name} downloaded — upload it in Alma (see the green box at the top).`);
  } catch (e) {
    setStatus(`The package could not be made: ${e.message}`, true);
  } finally {
    $('#download').disabled = false;
  }
}

/* ------------------------------------------------------------- rendering */
/**
 * PAGE TABS — "Settings" (#main + the bar) and "HTML features" (#help, the
 * markup-only features from markup-help.js). The tabs appear once there is
 * something to show and markup-help.js is loaded.
 */
function showPage(which) {
  const help = which === 'help';
  $('#main').hidden = help;
  $('#help').hidden = !help;
  $('#tab-settings').setAttribute('aria-selected', String(!help));
  $('#tab-help').setAttribute('aria-selected', String(help));
  if (help && !$('#help').childElementCount) $('#help').append(...helpPanel());
}
function initPageTabs() {
  if (!Array.isArray(window.EC_MARKUP_HELP) || !$('#pagetabs').hidden) return;
  $('#pagetabs').hidden = false;
  $('#tab-settings').addEventListener('click', () => showPage('settings'));
  $('#tab-help').addEventListener('click', () => showPage('help'));
}

/** The "HTML features" page: one card per entry of window.EC_MARKUP_HELP. */
function helpPanel() {
  const intro = el('div', { class: 'intro' },
    el('p', { style: 'margin:0' }, ...rich('These features need no setting — or only a switch in the settings — but **markup in your own HTML**: the home page (assets/homepage/), the header and footer (assets/header-footer/). Copy an example into your file and adapt the texts. Full examples with explanations: the kit\'s examples folder (examples/homepage_en.html).')));
  return [intro, ...window.EC_MARKUP_HELP.map((h) => {
    const code = el('pre', {}, el('code', {}, h.code));
    const copy = el('button', { type: 'button', class: 'link', onclick: (e) => {
      const done = () => { e.target.textContent = t('Copied'); setTimeout(() => { e.target.textContent = t('Copy'); }, 1500); };
      (navigator.clipboard ? navigator.clipboard.writeText(h.code) : Promise.reject()).then(done, () => {
        const r = document.createRange(); r.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(r);
      });
    } }, t('Copy'));
    return el('article', { class: 'help-card' },
      el('h2', {}, h.title, el('span', { class: 'needs' + (h.needs ? ' setting' : '') }, h.needs ? t('needs: {setting}', { setting: h.needs }) : t('works always'))),
      el('p', { style: 'margin:0' }, h.what),
      code, copy,
      Array.isArray(h.notes) && h.notes.length ? el('ul', { class: 'notes' }, h.notes.map((n) => el('li', {}, n))) : null);
  })];
}

function render() {
  initPageTabs();
  const main = $('#main');
  if (KIT) main.replaceChildren(...makerPanels(), languagesPanel());
  // Package editor: the package route (drop zone / "Your package" / done) — see PACKAGE MODE.
  else main.replaceChildren(...packagePanels(), languagesPanel());
  for (const [key, sub] of Object.entries(schema.properties || {})) {
    const s = resolve(sub);
    if (!(key in values)) continue; // section this view does not have
    if (KIT && KIT.hiddenSections.includes(key)) continue; // feature not in the noob kit
    if (kind(s) === 'object') main.append(section(key, s));
    else main.append(el('div', { class: 'section-body intro' + (s['x-advanced'] ? ' adv' : '') }, field([key], s)));
    // The addresses belong with the feature that prints them.
    if (key === 'printReturnLabel') main.append(librariesPanel());
  }
  if (!KIT && !('printReturnLabel' in values)) main.append(librariesPanel()); // older package: still at the end
  applyAdvanced();
  refreshStatus();
}

/**
 * Languages of this view: add (two-letter code + name) or remove. English is
 * the fallback and stays. Adding gives every text a line for the language;
 * removing deletes its texts. Saved in settings.js ("languages"), which the
 * package reads (runtime-settings.ts) — no build needed.
 */
function languagesPanel() {
  const list = el('div', { class: 'langs' });
  for (const l of languages) {
    list.append(el('span', { class: 'lang-chip' }, `${l.name} (${l.code})`,
      l.code === 'en'
        ? el('small', {}, t(' — fallback'))
        : el('button', { type: 'button', class: 'link', title: t('Remove {name}', { name: l.name }), 'aria-label': t('Remove {name}', { name: l.name }), onclick: () => removeLanguage(l) }, '✕')));
  }
  const code = el('input', { type: 'text', placeholder: t('code, e.g. it'), maxlength: '2', size: '6', 'aria-label': t('Language code') });
  const name = el('input', { type: 'text', placeholder: t('name, e.g. Italiano'), 'aria-label': t('Language name') });
  const msg = el('p', { class: 'error' });
  const add = () => {
    const c = code.value.trim().toLowerCase(), n = name.value.trim();
    if (!/^[a-z]{2}$/.test(c)) { msg.textContent = t('The code is two letters, as in the address (lang=it).'); return; }
    if (languages.some((l) => l.code === c)) { msg.textContent = t('{code} is already there.', { code: c }); return; }
    if (!n) { msg.textContent = t('Give the language a name.'); return; }
    languages.push({ code: c, name: n });
    render();
  };
  return el('details', { class: 'section' },
    el('summary', {}, el('h2', {}, t('Languages')), el('span', { class: 'chip' }, String(languages.length))),
    el('div', { class: 'section-body' },
      el('p', { class: 'desc' }, t('The languages of this view. Adding one gives every text below a line for it (empty = the English text is shown). Also needed, outside this editor: switch the language on for the view in Alma, and add its home page, header and footer files (copy homepage_en.html to homepage_xx.html and translate it).')),
      list,
      el('div', { class: 'lang-add' }, code, name, el('button', { type: 'button', class: 'secondary', onclick: add }, t('Add language'))),
      msg));
}

function removeLanguage(lang) {
  if (!confirm(t('Remove {name}? All {name} texts in these settings are deleted.', { name: lang.name }))) return;
  const codes = languages.map((l) => l.code);
  languages = languages.filter((l) => l.code !== lang.code);
  // Delete the language from every translated value (objects whose keys are languages).
  (function walk(node) {
    if (!node || typeof node !== 'object' || Array.isArray(node)) return;
    const keys = Object.keys(node);
    if (keys.length && keys.includes('en') && keys.every((k) => codes.includes(k))) { delete node[lang.code]; return; }
    Object.values(node).forEach(walk);
  })(values);
  render();
}

/**
 * Return labels: the address printed on the label for each library, keyed by
 * the Alma library code (BCB, BCENT, …). Saved in settings.js ("libraries"),
 * read by the label page (assets/return-label/label.js) — no build needed.
 * Same data as data/return-labels.json in the developers' repository; importing
 * this settings.js there (npm run settings → Import settings.js…) copies it back.
 */
function librariesPanel() {
  const d = el('details', { class: 'section' });
  const changed = el('span', { class: 'chip changed', hidden: true });
  d.dataset.key = '__libraries';
  d._changed = changed;
  const body = el('div', { class: 'section-body' });
  d.append(el('summary', {}, el('h2', {}, 'Return labels'),
    el('span', { class: 'chip' }, libraries ? String(Object.keys(libraries).length) : '—'), changed), body);

  if (!libraries) {
    body.append(el('p', { class: 'desc' },
      'This settings.js has no return addresses — it was made by an older package. The label page uses the addresses built into the package. ',
      'To edit them here, open the settings.js of a package built after October 2026.'));
    return d;
  }
  body.append(el('p', { class: 'desc' },
    'The address printed on the return label, per library. The code is the Alma library code of the loan (e.g. BCB). ',
    'Lines are printed in this order, one per line; a library without lines gets no label. ',
    'Used only when "Print return label" is activated.'));

  const codes = Object.keys(libraries).filter((c) => !c.startsWith('_'));
  for (const code of codes) body.append(libraryRow(code));

  // Add a library: code + name. The lines are filled in afterwards in its card.
  const code = el('input', { type: 'text', placeholder: 'code, e.g. BCB', size: '12', 'aria-label': 'Library code' });
  const name = el('input', { type: 'text', placeholder: 'library name', 'aria-label': 'Library name' });
  const msg = el('p', { class: 'error' });
  const add = () => {
    const c = code.value.trim(), n = name.value.trim();
    if (!/^[A-Za-z0-9_-]+$/.test(c)) { msg.textContent = 'The code is the Alma library code: letters, digits, _ or - (e.g. BCB).'; return; }
    if (libraries[c]) { msg.textContent = `${c} is already there.`; return; }
    if (!n) { msg.textContent = 'Give the library a name.'; return; }
    libraries[c] = { name: n, returnAddress: [n] };
    render();
    openPanel('__libraries');
  };
  body.append(el('div', { class: 'lang-add', style: 'margin-top:.75rem' }, code, name,
    el('button', { type: 'button', class: 'secondary', onclick: add }, 'Add library')), msg);
  return d;
}

/** One library: code (+ remove) on the left; name and address lines on the right. */
function libraryRow(code) {
  const lib = libraries[code];
  const row = el('div', { class: 'lib' });
  const errBox = el('p', { class: 'error' });
  const errKey = `libraries.${code}`;
  const mark = () => {
    const err = !lib.name || !lib.name.trim() ? 'The name is required.' : null;
    if (err) errors.set(errKey, err); else errors.delete(errKey);
    errBox.textContent = err || '';
    row.classList.toggle('invalid', !!err);
    row.classList.toggle('changed', !same(lib, originalLibraries && originalLibraries[code]));
    refreshStatus();
  };
  const remove = () => {
    if (!confirm(`Remove ${code} (${lib.name})? Loans from this library then get no return label.`)) return;
    delete libraries[code];
    errors.delete(errKey);
    render();
    openPanel('__libraries');
  };
  const name = el('input', { type: 'text', value: lib.name || '', 'aria-label': `Name of ${code}`,
    oninput: (e) => { lib.name = e.target.value; mark(); } });
  const lines = el('textarea', { rows: Math.max(4, (lib.returnAddress || []).length + 1), 'aria-label': `Return address of ${code}, one line per line`,
    placeholder: 'No lines = no label for this library',
    oninput: (e) => {
      const list = e.target.value.split('\n').map((x) => x.trim()).filter(Boolean);
      if (list.length) lib.returnAddress = list; else delete lib.returnAddress;
      mark();
    } }, (lib.returnAddress || []).join('\n'));
  row.append(
    el('div', { class: 'code' }, code, el('button', { type: 'button', class: 'link', onclick: remove }, 'Remove')),
    el('div', {}, name, lines, errBox));
  row.classList.toggle('changed', !same(lib, originalLibraries && originalLibraries[code]));
  return row;
}

/** Re-open a panel after render() rebuilt the page (render closes all panels). */
function openPanel(key) {
  const d = document.querySelector(`details.section[data-key="${key}"]`);
  if (d) { d.open = true; d.scrollIntoView({ block: 'nearest' }); }
}

/** Number of libraries added, removed or edited. */
function librariesChanged() {
  if (!libraries && !originalLibraries) return 0;
  const a = libraries || {}, b = originalLibraries || {};
  let n = 0;
  for (const c of new Set([...Object.keys(a), ...Object.keys(b)])) if (!same(a[c], b[c])) n++;
  return n;
}

/**
 * LIST OF OBJECTS (schema: array whose items are objects), e.g. the custom
 * dialogs: one card per item with its own fields (texts get the WYSIWYG), a
 * Remove button per card and "Add" at the bottom. Items that have a `name`
 * property must use distinct names (it is how they are found on the page).
 */
function objectList(path, s) {
  const itemS = resolve(s.items);
  const what = (itemS.title || 'item').toLowerCase();
  const items = () => getPath(values, path) || [];
  const box = el('div', { class: 'objlist' });
  const sectionKey = path[0];

  /**
   * "Opens from" of a custom dialog (the item's `selector`): required, and not
   * the same as another item's (the first would always win).
   */
  const triggerCheck = (i) => (v) => {
    // (named `trig`, not `t`: t() is the translation helper)
    const trig = (v || '').trim();
    if (!trig) return t('Say what opens the dialog, e.g. dialog-borrowing.');
    const clash = items().some((it, j) => j !== i && (it?.selector || '').trim() === trig);
    return clash ? t('Another {what} already opens from "{trigger}".', { what, trigger: trig }) : null;
  };

  items().forEach((item, i) => {
    const card = el('fieldset', { class: 'objlist__item' },
      el('legend', {}, `${itemS.title || t('Item')} ${i + 1}`,
        el('button', { type: 'button', class: 'link objlist__remove', onclick: () => {
          const which = `${what} ${i + 1}${item?.selector ? ` (${item.selector})` : ''}`;
          if (!confirm(t('Remove {which}?', { which }))) return;
          const next = clone(items()); next.splice(i, 1);
          // Drop errors of this list; they are re-evaluated when it is drawn again.
          for (const k of [...errors.keys()]) if (k.startsWith(path.join('.') + '.')) errors.delete(k);
          setPath(values, path, next);
          if (s['x-tabs']) TAB_STATE.set(path.join('.'), Math.max(0, i - 1)); // the tab before it
          render(); openPanel(sectionKey);
        } }, t('Remove'))));
    for (const [k, sub] of Object.entries(itemS.properties || {})) {
      const r = resolve(sub);
      // A custom dialog's "Opens from" (the only list item with a css-selector field).
      const isTrigger = k === 'selector' && r.format === 'css-selector';
      card.append(field([...path, i, k], r, isTrigger ? { check: triggerCheck(i) } : {}));
      // Show what opens it, filled in with the current value.
      if (isTrigger) card.append(triggerHint([...path, i, k]));
    }
    box.append(card);
  });
  const add = el('button', { type: 'button', class: 'secondary', onclick: () => {
    setPath(values, path, [...clone(items()), blankFor(itemS)]);
    if (s['x-tabs']) TAB_STATE.set(path.join('.'), items().length - 1); // open the new one
    render(); openPanel(sectionKey);
  } }, t('+ Add {what}', { what }));
  if (s['x-tabs']) return tabbed(path, s, itemS, box, add);
  box.append(add);
  return box;
}

/** Selected tab per tabbed list (dot path → index); survives the redraws of render(). */
const TAB_STATE = new Map();

/**
 * "x-tabs" (schema, on a list): the items as TABS — one item's fields at a
 * time — instead of cards under each other (long lists of banners, dialogs,
 * badges, search tips). The cards built by objectList() become the panels.
 * Tab label: the item's "x-tabLabel" field (text, first line of a list, the
 * English of a translated text, HTML without tags), shortened; "x-tabEmptyLabel"
 * when that field is empty, else "<Item> n". A tab whose fields have an error
 * is marked, so a problem in a hidden tab is still noticed.
 * Twin: tabbed() in scripts/settings-ui/public/app.js.
 */
function tabbed(path, s, itemS, box, add) {
  const key = path.join('.');
  const cards = [...box.children];
  const n = cards.length;
  let current = Math.min(TAB_STATE.get(key) ?? 0, Math.max(0, n - 1));
  const label = (i) => {
    const item = (getPath(values, path) || [])[i];
    let v = item ? item[s['x-tabLabel']] : '';
    if (Array.isArray(v)) v = v.find((x) => String(x).trim()) || '';
    else if (v && typeof v === 'object') v = v.en || Object.values(v).find(Boolean) || '';
    v = String(v || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    if (!v) v = s['x-tabEmptyLabel'] && item ? s['x-tabEmptyLabel'] : `${itemS.title || t('Item')} ${i + 1}`;
    return v.length > 28 ? v.slice(0, 27) + '…' : v;
  };
  const strip = el('div', { class: 'tabs', role: 'tablist', 'aria-label': s.title || '' });
  const buttons = cards.map((card, i) => {
    const b = el('button', { type: 'button', role: 'tab', class: 'tab', onclick: () => select(i) });
    card.setAttribute('role', 'tabpanel');
    return b;
  });
  const refresh = () => buttons.forEach((b, i) => {
    b.textContent = label(i);
    b.setAttribute('aria-selected', String(i === current));
    b.classList.toggle('has-error', [...errors.keys()].some((k) => k.startsWith(`${key}.${i}.`)));
  });
  const select = (i) => {
    current = i; TAB_STATE.set(key, i);
    cards.forEach((c, j) => { c.hidden = j !== i; });
    refresh();
  };
  strip.append(...buttons, add);
  add.classList.add('tab-add');
  const wrap = el('div', { class: 'objlist objlist--tabs' }, strip, ...cards);
  if (!n) wrap.append(el('p', { class: 'desc' }, t('None yet. Click "{add}" to add one.', { add: add.textContent })));
  // Labels follow what is typed (and the WYSIWYG, which reports on keyup/change).
  for (const ev of ['input', 'change', 'keyup']) wrap.addEventListener(ev, () => refresh());
  select(current);
  return wrap;
}

/**
 * What opens the dialog, kept up to date while typing "Opens from":
 *   plain word → <a href="#WORD">…</a>  or  class="WORD"
 *   otherwise  → elements matching the CSS selector
 * Same plain-word rule as the module (PLAIN_WORD in ec-custom-dialogs.component.ts).
 */
function triggerHint(valuePath) {
  const code = el('code', {});
  const label = el('span', {});
  const update = () => {
    // The page is redrawn on Add/Remove: a hint no longer in the page stops listening.
    if (!code.isConnected && code.textContent) { document.removeEventListener('input', update); return; }
    const v = (getPath(values, valuePath) || '').trim() || 'dialog-name';
    const word = /^[A-Za-z][A-Za-z0-9_-]*$/.test(v);
    label.textContent = word ? t('Opens with: ') : t('Opens with: elements matching the CSS selector ');
    code.textContent = word ? t('<a href="#{v}">…</a>  or  class="{v}"', { v }) : v;
  };
  update();
  document.addEventListener('input', update); // re-read the name while it is typed
  return el('p', { class: 'desc objlist__hint' }, label, code);
}

/** An empty value for a schema: '' / false / minimum / [] / { en: '' } / object of blanks. */
function blankFor(s) {
  s = resolve(s);
  // The schema's "default" first (e.g. a new banner: under the menu, theme colour,
  // can be closed); a choice list without one starts at its first option.
  if (s.default !== undefined) return JSON.parse(JSON.stringify(s.default));
  if (s.enum) return s.enum[0];
  if (s.type === 'boolean') return false;
  if (s.type === 'integer' || s.type === 'number') return s.minimum ?? 0;
  if (s.type === 'array') return [];
  if (s.type === 'object' && isLocalised(s)) return { en: '' };
  if (s.type === 'object') {
    const o = {};
    for (const [k, sub] of Object.entries(s.properties || {})) o[k] = blankFor(sub);
    return o;
  }
  return '';
}

function section(key, s) {
  const d = el('details', { class: 'section' + (s['x-advanced'] ? ' adv' : '') });
  const chips = [];
  if (s.properties && s.properties.enabled) {
    const on = values[key] && values[key].enabled === true;
    chips.push(el('span', { class: 'chip' + (on ? ' on' : '') }, on ? t('on') : t('off')));
  }
  if (isNew([key])) chips.push(el('span', { class: 'chip new' }, t('new')));
  const changed = el('span', { class: 'chip changed', hidden: true });
  d.append(el('summary', {}, el('h2', {}, s.title || key), ...chips, changed),
    el('div', { class: 'section-body' },
      s.description ? el('p', { class: 'desc' }, s.description) : null,
      s['x-kioskLinks'] ? kioskLinks() : null,
      ...fields([key], s)));
  d.dataset.key = key;
  d._changed = changed;
  return d;
}

/**
 * "x-kioskLinks" (schema, kiosk section): the two addresses that switch a
 * reading room PC to kiosk mode and back, for this view, with Copy buttons.
 * The page does not know the Primo address (it is opened from the package, or
 * from disk), so there is a box for it, remembered in this browser only.
 * The parameter is read by src/app/shared/kiosk.ts (ec_kiosk=1 / ec_kiosk=0).
 * Twin: kioskLinks() in scripts/settings-ui/public/app.js.
 */
function kioskLinks() {
  const KEY = 'ec-editor:primoAddress';
  let saved = '';
  try { saved = localStorage.getItem(KEY) || ''; } catch { /* storage blocked */ }
  const host = el('input', { type: 'url', value: saved, placeholder: 'https://yourlibrary.primo.exlibrisgroup.com',
    'aria-label': t('Primo address'), style: 'max-width:28rem' });
  const rows = el('div', {});
  const draw = () => {
    const vid = (KIT ? maker.vid : envelope && envelope.vid) || 'INST:VIEW';
    const base = (host.value.trim() || 'https://yourlibrary.primo.exlibrisgroup.com').replace(/\/+$/, '');
    const url = (on) => `${base}/nde/home?vid=${vid}&ec_kiosk=${on ? 1 : 0}`;
    rows.replaceChildren(...[[true, t('Switch a PC ON')], [false, t('Switch it OFF again')]].map(([on, label]) => {
      const code = el('code', {}, url(on));
      return el('p', { class: 'desc', style: 'margin:.25rem 0' }, el('strong', {}, label + ': '), code, ' ',
        el('button', { type: 'button', class: 'link', onclick: (e) => {
          const done = () => { e.target.textContent = t('Copied'); setTimeout(() => { e.target.textContent = t('Copy'); }, 1500); };
          (navigator.clipboard ? navigator.clipboard.writeText(code.textContent) : Promise.reject()).then(done, () => {
            const r = document.createRange(); r.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(r);
          });
        } }, t('Copy')));
    }));
  };
  host.addEventListener('input', () => { try { localStorage.setItem(KEY, host.value.trim()); } catch { /* ignore */ } });
  // Redraw on every input in the page: the address box, and the maker's view
  // code field (the links carry the view code). Stops once the box is gone.
  const onInput = () => { if (!rows.isConnected && rows.childNodes.length) { document.removeEventListener('input', onInput); return; } draw(); };
  document.addEventListener('input', onInput);
  draw();
  return el('div', { class: 'intro', style: 'margin:.5rem 0 1rem' },
    el('p', { class: 'desc', style: 'margin:0 0 .4rem' }, t('Your Primo address (only to build the links below; not saved in the settings): ')), host, rows,
    el('p', { class: 'desc', style: 'margin:.4rem 0 0' }, t('Open the first address once on each reading room PC (or make it the start page). The PC stays in kiosk mode until the second address is opened on it.')));
}

/** Are the "x-choices" of `s` in force? Every sibling named in "x-choicesWhen" must have the given value (missing = the sibling's schema default). */
function choicesActive(path, s) {
  if (!Array.isArray(s['x-choices'])) return false;
  const when = s['x-choicesWhen'] || {};
  return Object.entries(when).every(([k, want]) => (getPath(values, [...path.slice(0, -1), k]) ?? want) === want);
}

/**
 * "x-showWhen" (schema, on a field): { "<sibling key>": <value>, … } — the
 * field is only SHOWN while every named sibling field (same object / same
 * list card) has that value. E.g. a banner's "Own colour" only appears with
 * Style = "My own colour" ({ "style": "custom" }). The sibling that decides
 * needs "x-rerender": true, so the form is redrawn when it changes.
 * A hidden field keeps its value in the settings (picking "My own colour"
 * again brings the old colour back); the module ignores it anyway — see
 * notice-banners.ts / search-tips.ts, which only use `color` with style
 * "custom". A missing sibling counts as matching (same rule as x-choicesWhen).
 * Twin: showWhenActive() in scripts/settings-ui/public/app.js.
 */
function showWhenActive(path, s) {
  const when = s['x-showWhen'];
  if (!when || typeof when !== 'object') return true;
  return Object.entries(when).every(([k, want]) => (getPath(values, [...path.slice(0, -1), k]) ?? want) === want);
}

function fields(path, s) {
  return Object.entries(s.properties || {}).map(([k, sub]) => {
    const r = resolve(sub);
    const p = [...path, k];
    if (getPath(values, p) === undefined && getPath(original, p) === undefined) return null; // not in this view
    if (kind(r) === 'object') {
      return el('fieldset', { class: r['x-advanced'] ? 'adv' : '' },
        el('legend', {}, r.title || k),
        r.description ? el('p', { class: 'desc' }, r.description) : null,
        ...fields(p, r));
    }
    return field(p, r);
  });
}

function field(path, s, opts = {}) {
  // Hidden by "x-showWhen" (see showWhenActive): an empty, hidden placeholder,
  // so callers can append the result as usual. Its error (if any) must not
  // block "Download" / "Make package" while the field cannot even be seen.
  if (!showWhenActive(path, s)) {
    errors.delete(path.join('.'));
    return el('div', { class: 'field', hidden: true });
  }
  const k = kind(s);
  const id = 'f_' + path.join('_');
  const wrap = el('div', { class: 'field' + (s['x-advanced'] ? ' adv' : '') });
  const name = el('div', { class: 'name' }, el('label', { for: id }, s.title || path[path.length - 1]),
    s['x-advanced'] ? el('span', { class: 'adv-tag' }, t('advanced')) : null,
    isNew(path) && !isNew([path[0]]) ? el('span', { class: 'chip new' }, t('new')) : null,
    s.description ? el('small', {}, s.description) : null);
  const control = el('div', {});
  const value = getPath(values, path);
  const set = (v, err) => {
    setPath(values, path, v);
    const key = path.join('.');
    if (err) errors.set(key, err); else errors.delete(key);
    wrap.classList.toggle('invalid', !!err);
    errBox.textContent = err || '';
    wrap.classList.toggle('changed', !same(getPath(values, path), getPath(original, path)));
    refreshStatus();
  };
  var errBox = el('p', { class: 'error' }); // var: used by the string branch's initial check below

  if (k === 'boolean') {
    control.append(el('input', { type: 'checkbox', id, checked: !!value, onchange: (e) => set(e.target.checked) }));
  } else if (k === 'number') {
    control.append(el('input', { type: 'number', id, value: value ?? '', min: s.minimum, step: s.type === 'integer' ? 1 : 'any',
      oninput: (e) => {
        const v = e.target.value === '' ? NaN : Number(e.target.value);
        let err = null;
        if (Number.isNaN(v)) err = t('Enter a number.');
        else if (s.type === 'integer' && !Number.isInteger(v)) err = t('Enter a whole number.');
        else if (s.minimum !== undefined && v < s.minimum) err = t('At least {n}.', { n: s.minimum });
        set(Number.isNaN(v) ? value : v, err);
      } }));
  } else if (k === 'enum') {
    // "x-enumNames" (same order as "enum") = what the user sees; the value stays the code.
    const names = Array.isArray(s['x-enumNames']) ? s['x-enumNames'] : [];
    // "x-rerender": other fields depend on this choice (e.g. a prefill's "From"
    // decides how its "Value" is asked) — redraw the section after a change.
    control.append(el('select', { id, onchange: (e) => {
      set(e.target.value);
      if (s['x-rerender']) { render(); openPanel(path[0]); }
    } }, s.enum.map((opt, i) => el('option', { value: opt, selected: opt === value }, names[i] || (opt === '' ? t('(none)') : opt)))));
  } else if (k === 'string' && choicesActive(path, s)) {
    // "x-choices": a dropdown of known values plus "Other…" with a text box —
    // e.g. the Alma user details for a prefill. Only while the sibling fields
    // named in "x-choicesWhen" have those values (e.g. from = "user");
    // otherwise the plain text box below.
    const known = s['x-choices'].map((c) => c.value);
    const other = el('input', { type: 'text', value: known.includes(value) ? '' : (value ?? ''), placeholder: t('field name'),
      'aria-label': t('{title} — other', { title: s.title || '' }), style: 'margin-top:.35rem', oninput: (e) => set(e.target.value.trim()) });
    other.hidden = known.includes(value) || !value;
    const OTHER = '__other__';
    const select = el('select', { id, onchange: (e) => {
      const v = e.target.value;
      other.hidden = v !== OTHER;
      if (v === OTHER) { other.focus(); set(other.value.trim()); } else set(v);
    } },
      el('option', { value: '', selected: !value }, t('— choose —')),
      s['x-choices'].map((c) => el('option', { value: c.value, selected: c.value === value }, c.label || c.value)),
      el('option', { value: OTHER, selected: !!value && !known.includes(value) }, t('Other…')));
    control.append(select, other);
  } else if (k === 'string') {
    // Schema "pattern" (e.g. a custom dialog's name): checked on every key
    // stroke and right away, so an empty new item blocks the download/package.
    // "x-patternHint" in the schema says what is expected; the default fits names.
    const patternError = (v) => (s.pattern && !new RegExp(s.pattern).test(v || '')
      ? (s['x-patternHint'] || t('Letters, digits, - and _ only, starting with a letter (no spaces).')) : null);
    // "format": "css-selector": the browser itself says whether it is a valid selector.
    const selectorError = (v) => {
      if (s.format !== 'css-selector' || !v || !v.trim()) return null;
      try { document.createDocumentFragment().querySelector(v); return null; } catch { return t('Not a valid CSS selector.'); }
    };
    control.append(el('input', { type: s.format === 'uri' ? 'url' : 'text', id, value: value ?? '',
      spellcheck: s.format === 'css-selector' ? 'false' : null,
      oninput: (e) => set(e.target.value, s.format === 'uri' && e.target.value && !isUrl(e.target.value)
        ? t('Enter a full web address (https://…).') : patternError(e.target.value) || selectorError(e.target.value) || (opts.check ? opts.check(e.target.value) : null)) }));
    const initial = patternError(value) || selectorError(value) || (opts.check ? opts.check(value) : null);
    if (initial) { errors.set(path.join('.'), initial); errBox.textContent = initial; wrap.classList.add('invalid'); }
  } else if (k === 'color') {
    // COLOUR: the browser's colour picker + the code (#rrggbb) to type or paste
    // + Clear. Empty = "not set" (the feature then uses its default, e.g. the
    // theme colour) — a colour input itself cannot be empty, hence the text box.
    const ok = (v) => !v || /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v);
    const full = (v) => (/^#[0-9a-f]{3}$/i.test(v) ? '#' + v.slice(1).split('').map((c) => c + c).join('') : v);
    const swatch = el('input', { type: 'color', value: ok(value) && value ? full(value) : '#ffffff', 'aria-label': t('{title} — pick', { title: s.title || '' }) });
    const code = el('input', { type: 'text', id, value: value ?? '', placeholder: t('not set'), spellcheck: 'false' });
    const unset = el('span', { class: 'unset' }, value ? '' : t('not set — default colour'));
    const apply = (v) => {
      code.value = v; unset.textContent = v ? '' : t('not set — default colour');
      if (ok(v) && v) swatch.value = full(v);
      set(v, ok(v) ? null : (s['x-patternHint'] || t('A colour as #RRGGBB.')));
    };
    swatch.addEventListener('input', () => apply(swatch.value));
    code.addEventListener('input', () => apply(code.value.trim()));
    control.append(el('div', { class: 'colour' }, swatch, code,
      el('button', { type: 'button', class: 'link', onclick: () => apply('') }, t('Clear')), unset));
  } else if (k === 'code') {
    // CODE (e.g. a widget's embed code): kept exactly as pasted — never run or
    // cleaned here; the module runs it in Primo (see ec-custom-dialogs.component.ts).
    control.append(el('textarea', { class: 'json', id, rows: 6, spellcheck: 'false', placeholder: t('Paste the embed code here (optional)'),
      oninput: (e) => set(e.target.value) }, value ?? ''));
  } else if (k === 'date') {
    // DATE: the browser's date picker; the value is "YYYY-MM-DD" ("" = no date).
    control.append(el('input', { type: 'date', id, value: value ?? '', oninput: (e) => set(e.target.value) }),
      el('button', { type: 'button', class: 'link', style: 'margin-left:.5rem', onclick: (e) => {
        e.target.previousElementSibling.value = ''; set('');
      } }, t('Clear')));
  } else if (k === 'objlist') {
    control.append(objectList(path, s));
    wrap.classList.add('wide');
  } else if (k === 'list') {
    control.append(el('textarea', { id, rows: Math.max(2, (value || []).length + 1),
      oninput: (e) => set(e.target.value.split('\n').map((x) => x.trim()).filter(Boolean)) }, (value || []).join('\n')),
      el('p', { class: 'desc', style: 'margin:.2rem 0 0' }, t('One per line.')));
  } else if (k === 'localised') {
    // One input per language. HTML messages (schema "format": "html") get the
    // WYSIWYG editor from rich-text.js; plain texts a one-line input.
    const html = s.format === 'html';
    const current = () => getPath(values, path) || {};
    for (const lang of languages) {
      const v = current()[lang.code] ?? '';
      const label = `${s.title || ''} (${lang.name})`;
      const update = (text) => {
        const next = { ...current() };
        if (text === '' && lang.code !== 'en') delete next[lang.code]; else next[lang.code] = text;
        // English is the fallback for every language: warn when it is empty while others are not.
        const err = !next.en && Object.keys(next).some((c) => c !== 'en' && next[c]) ? t('English is used whenever a language is missing — fill it in too.') : null;
        set(next, err);
      };
      let input;
      if (html) {
        input = el('textarea', { class: 'html', 'aria-label': label }, v);
        const holder = el('div', {}, input);
        control.append(el('div', { class: 'lang' }, el('span', {}, lang.name), holder));
        if (window.EcRichText) window.EcRichText.create(input, { onChange: update });
        else input.addEventListener('input', () => update(input.value)); // rich-text.js missing: plain HTML box
      } else {
        input = el('input', { type: 'text', value: v, 'aria-label': label });
        input.addEventListener('input', () => update(input.value));
        control.append(el('div', { class: 'lang' }, el('span', {}, lang.name), el('div', {}, input)));
      }
    }
