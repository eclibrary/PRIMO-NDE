<!doctype html>
<!--
  Return label page — served from the customization package (no Europa dependency):
    https://<primo host>/nde/custom/32EUC_INST-VU2/assets/return-label/index.html?librarycode=BCB&userlocation=BRU&lang=en

  Parameters (all optional, first match wins):
    librarycode   Alma library code of the loan's library → its returnAddress
    userlocation  BRU / LUX → the resource-sharing library for that city (fallback)
    address       explicit lines separated by ";" (legacy links)
    lang          en | fr | de — text of the on-screen instructions

  Data — the return address of each library, keyed by Alma library code:
    1. ../settings.js, section "libraries" — edited with the settings editor in
       the package (assets/editor/index.html → Return labels) or, for
       developers, data/return-labels.json + npm run settings. Fetched as text
       and parsed by label.js, never executed.
    2. ../data/libraries.js (window.EC_LIBRARIES), generated by
       scripts/return-labels.cjs from data/return-labels.json — the fallback
       when settings.js cannot be read (older package, page opened from disk).
  Both are .js rather than JSON because Alma rejects .json in customization
  packages. Nothing inline: scripts are separate files so a strict
  content-security policy on the Primo host cannot block them.

  Every view's package carries this page (src/assets/return-label/); the link
  in the library card appears only in views where printReturnLabel.enabled
  ("Activate") is on.

  This page is used by the "Print return label" link in the library card AND by
  links in e-mails, so keep its URL and parameter names stable.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Print return label</title>
  <link rel="stylesheet" href="label.css">
</head>
<body>
  <main class="label" id="label" aria-live="polite">…</main>

  <section class="noprint" id="help">
    <p data-i18n="instructions"></p>
    <p><button type="button" id="print" data-i18n="print"></button></p>
    <p class="thanks" data-i18n="thanks"></p>
  </section>

  <script src="../data/libraries.js"></script>
  <script src="label.js"></script>
</body>
</html>
