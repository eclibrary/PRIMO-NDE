<!doctype html>
<!--
  Return label page — served from the customization package (no Europa dependency):
    https://<primo host>/custom/32EUC_INST-VU2/assets/return-label/index.html?librarycode=BCB&userlocation=BRU&lang=en

  Parameters (all optional, first match wins):
    librarycode   Alma library code of the loan's library → its returnAddress
    userlocation  BRU / LUX → the resource-sharing library for that city (fallback)
    address       explicit lines separated by ";" (legacy links)
    lang          en | fr — text of the on-screen instructions

  Data: ../data/libraries.js, generated by scripts/return-labels.cjs from
  data/return-labels.json (the single place where return addresses are managed);
  it sets window.EC_LIBRARIES. It is a script rather than JSON because Alma
  rejects .json in customization packages. Nothing inline: both scripts are separate files so a strict
  content-security policy on the Primo host cannot block them.

  This page is used by the "Print return label" link in the library card AND by
  links in e-mails, so keep its URL and parameter names stable.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Print return label</title>
  <link rel="stylesheet" href="label.css">
</head>
<body>
  <main class="label" id="label" aria-live="polite">…</main>

  <section class="noprint" id="help">
    <p data-i18n="instructions"></p>
    <p><button type="button" id="print" data-i18n="print"></button></p>
    <p class="thanks" data-i18n="thanks"></p>
  </section>

  <script src="../data/libraries.js"></script>
  <script src="label.js"></script>
</body>
</html>
